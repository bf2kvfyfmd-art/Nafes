<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوصلة الأداء المهني | مجمع المنتزه التعليمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p900:#1f0f45;--p800:#2c1762;--p700:#3d2283;--p600:#5332a6;--p100:#efe9fb;--p50:#f7f4fd;
  --g600:#a8842f;--g500:#c9a24a;--g300:#e6cf94;--g100:#f8f0dc;
  --ink:#1d1830;--mut:#6b6580;--line:#e6e1f0;--bg:#f6f4fa;--ok:#1f8a5b;--okbg:#e5f5ed;--bad:#b3261e;--badbg:#fbeaea;--warn:#a86400;--warnbg:#fff4e0;
  --r:18px;--sh:0 10px 30px rgba(44,23,98,.10),0 2px 6px rgba(44,23,98,.06);
  --font:"Tajawal","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;--serif:"Amiri","Traditional Arabic","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit}
a{color:var(--p600)}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px}

/* Header */
.top{background:linear-gradient(135deg,var(--p900),var(--p700));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 4px 18px rgba(31,15,69,.25)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand svg{flex:none}
.brand b{font-size:18px;font-weight:800;display:block;line-height:1.3}
.brand small{color:var(--g300);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pct-pill{background:rgba(255,255,255,.12);border:1px solid rgba(230,207,148,.45);color:var(--g300);border-radius:99px;padding:3px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.progress{height:5px;background:rgba(255,255,255,.12)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--g500),var(--g300));transition:width .6s ease}
.stations{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 12px;scrollbar-width:none;max-width:1060px;margin:0 auto}
.stations::-webkit-scrollbar{display:none}
.st{flex:none;display:flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px 5px 10px;font-size:13px;background:rgba(255,255,255,.08);color:#d9d2ee;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.st .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);font-weight:700;font-size:12px}
.st.done .n{background:var(--g500);color:var(--p900)}
.st.on{background:#fff;color:var(--p800);font-weight:700}
.st.on .n{background:var(--p700);color:#fff}
.st.lock{opacity:.5;cursor:not-allowed}

main{padding:22px 0 40px;min-height:60vh}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:24px;margin-bottom:18px;border:1px solid var(--line)}
.card.flat{box-shadow:none}
h1,h2,h3{line-height:1.4;margin:0 0 10px}
h1{font-family:var(--serif);font-size:clamp(30px,6vw,48px);font-weight:700}
h2{font-size:clamp(20px,3.6vw,26px);color:var(--p800);font-weight:800}
h3{font-size:18px;color:var(--p700);font-weight:800}
p{margin:0 0 10px}
.mut{color:var(--mut)}
.eyebrow{display:inline-flex;align-items:center;gap:6px;color:var(--g600);font-weight:800;font-size:13px;letter-spacing:.2px;margin-bottom:6px}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:26px;background:radial-gradient(1200px 400px at 100% 0,#5a37b0 0,transparent 60%),linear-gradient(140deg,var(--p900),var(--p700));color:#fff;padding:36px 26px 30px;margin-bottom:18px;box-shadow:var(--sh)}
.hero h1{color:#fff;margin-bottom:4px}
.hero .sub{color:var(--g300);font-size:clamp(16px,2.8vw,20px);font-weight:700;margin-bottom:14px}
.hero .quote{display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(230,207,148,.4);border-radius:14px;padding:10px 16px;font-weight:700;font-size:17px}
.hero .meta{margin-top:16px;color:#d8cff0;font-size:14px}
.hero .bg-compass{position:absolute;left:-60px;bottom:-70px;opacity:.13;width:300px;height:300px}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.goal{display:flex;gap:10px;align-items:flex-start;background:var(--p50);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.goal .ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--p700);color:#fff;display:grid;place-items:center}
.journey{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;counter-reset:j}
.jstep{position:relative;background:#fff;border:1px dashed var(--g500);border-radius:14px;padding:12px;text-align:center}
.jstep .ic{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;background:var(--g100);color:var(--g600);display:grid;place-items:center}
.jstep b{display:block;color:var(--p800)}
.jstep span{font-size:13px;color:var(--mut)}

/* Forms */
label.f{display:block;font-weight:700;margin:12px 0 6px;color:var(--p800)}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;color:var(--ink);transition:border .2s,box-shadow .2s}
textarea.in{min-height:92px;resize:vertical}
.in:focus{outline:none;border-color:var(--p600);box-shadow:0 0 0 4px rgba(83,50,166,.12)}
.in.err{border-color:var(--bad)}
.hint{font-size:13px;color:var(--mut);margin-top:4px}
.errmsg{font-size:13px;color:var(--bad);margin-top:4px;font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;cursor:pointer;font-size:15px}
.check input{width:20px;height:20px;margin-top:4px;accent-color:var(--p700);flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:800;cursor:pointer;transition:transform .12s,box-shadow .2s,background .2s;text-decoration:none;min-height:46px}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--p700),var(--p600));color:#fff;box-shadow:0 6px 16px rgba(61,34,131,.28)}
.btn.gold{background:linear-gradient(135deg,var(--g500),#d9b866);color:var(--p900);box-shadow:0 6px 16px rgba(169,132,47,.3)}
.btn.ghost{background:#fff;color:var(--p700);border:1.5px solid var(--line)}
.btn.wa{background:#1f9d55;color:#fff;box-shadow:0 6px 16px rgba(31,157,85,.28)}
.btn.dan{background:var(--badbg);color:var(--bad)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.navbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}

/* Station header */
.shead{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.shead .badge{flex:none;width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,var(--g500),var(--g300));color:var(--p900);display:grid;place-items:center;box-shadow:0 6px 14px rgba(169,132,47,.3)}
.shead small{color:var(--g600);font-weight:800;font-size:13px}
.shead h2{margin:0}

/* Quiz */
.qtype{display:inline-block;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--p100);color:var(--p700);margin-bottom:8px}
.qtype.tf{background:var(--g100);color:var(--g600)}
.qtype.sc{background:#e6f1fb;color:#1d5d99}
.qtext{font-size:19px;font-weight:700;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:right;width:100%;border:1.6px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;cursor:pointer;transition:all .18s;font-size:16px;color:var(--ink)}
.opt:hover{border-color:var(--p600);background:var(--p50)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--p100);color:var(--p700);font-weight:800;display:grid;place-items:center;font-size:14px}
.opt.sel{border-color:var(--p700);background:var(--p50);box-shadow:0 0 0 3px rgba(83,50,166,.12)}
.opt.sel .k{background:var(--p700);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.dot{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:var(--mut)}
.dot.ans{background:var(--p100);color:var(--p700);border-color:var(--p100)}
.dot.cur{background:var(--p700);color:#fff;border-color:var(--p700)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:15px}
.fb.ok{background:var(--okbg);color:#0f5a3a;border-right:4px solid var(--ok)}
.fb.no{background:var(--badbg);color:#7c1a14;border-right:4px solid var(--bad)}
.fb.info{background:var(--p50);color:var(--p800);border-right:4px solid var(--p600)}

/* Score */
.score{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{--v:0;width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--g500) calc(var(--v)*1%),var(--p100) 0);flex:none}
.ring div{width:112px;height:112px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.ring b{font-size:32px;color:var(--p800);line-height:1}
.ring span{font-size:13px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--p600),var(--g500))}
.kpi small{color:var(--mut);font-weight:700;font-size:13px;display:block}
.kpi b{font-size:28px;color:var(--p800);line-height:1.3}
.kpi em{display:block;font-style:normal;font-size:13px;color:var(--g600);font-weight:700}
.cmp{display:grid;gap:10px;margin-top:6px}
.bar{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:14px;font-weight:700}
.bar .t{height:16px;background:var(--p100);border-radius:99px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:99px;transition:width 1s ease}

/* Learn */
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mod{position:relative;text-align:right;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:all .2s;color:var(--ink)}
.mod:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:var(--g300)}
.mod .num{font-family:var(--serif);font-size:28px;color:var(--g500);font-weight:700;line-height:1}
.mod b{display:block;margin-top:6px;color:var(--p800);font-size:16px}
.mod .seen{position:absolute;left:12px;top:12px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--p100);color:var(--p700)}
.mod.v{border-color:var(--g500);background:linear-gradient(180deg,#fff, var(--g100))}
.mod.v .seen{background:var(--ok);color:#fff}
.lesson h3{margin-top:18px}
.lesson ul{margin:6px 0 12px;padding-right:22px}
.lesson li{margin-bottom:4px}
.cycle{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.cyc{border-radius:16px;padding:14px;background:var(--p50);border:1.5px solid var(--line);text-align:center}
.cyc.now{background:linear-gradient(135deg,var(--p700),var(--p600));color:#fff;border-color:transparent}
.cyc.now small{color:var(--g300)}
.cyc b{display:block;font-size:17px}
.cyc small{color:var(--mut)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl th{background:var(--p800);color:#fff;font-weight:700;padding:10px;text-align:right}
.tbl td{padding:10px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:nth-child(even) td{background:var(--p50)}
.tscroll{overflow-x:auto;margin:10px 0;border-radius:14px}
.wbar{display:grid;grid-template-columns:minmax(120px,240px) 1fr 44px;gap:10px;align-items:center;font-size:14px;margin-bottom:6px}
.wbar .t{height:12px;background:var(--p100);border-radius:99px;overflow:hidden}
.wbar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--p600),var(--p700));border-radius:99px}
.wbar.half .t i{background:linear-gradient(90deg,var(--g500),var(--g600))}
.levels{display:grid;gap:6px;margin:8px 0}
.lv{display:grid;grid-template-columns:44px 1fr;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.lv b{display:grid;place-items:center;color:#fff;font-size:18px}
.lv div{padding:8px 12px;font-size:14.5px;background:#fff}
.lv div strong{color:var(--p800)}
.tip{background:var(--g100);border:1px solid var(--g300);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15px}
.tip b{color:var(--g600)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.pair>div{border-radius:14px;padding:12px;font-size:14.5px}
.pair .w{background:var(--badbg);border:1px solid #f1c7c4}
.pair .s{background:var(--okbg);border:1px solid #b9e2cd}
.pair small{font-weight:800;display:block;margin-bottom:4px}
.gap3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.gap3>div{border-radius:14px;padding:12px;text-align:center;font-size:14px}
.gap3 b{display:block;font-size:26px;line-height:1.2}
.split{display:grid;grid-template-columns:70fr 20fr 10fr;gap:6px;margin:10px 0}
.split>div{border-radius:12px;padding:10px;color:#fff;font-size:13.5px;min-width:0}
.split b{display:block;font-size:22px}

/* Practice */
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.act{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center;color:var(--ink)}
.act.on{background:var(--p700);color:#fff;border-color:var(--p700)}
.act.ok:not(.on){border-color:var(--ok);color:var(--ok)}
.sortitem{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}
.sortitem p{font-weight:700;margin-bottom:8px}
.tfrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}
.tfrow p{margin:0;font-weight:700;flex:1 1 260px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:700;min-width:44px;color:var(--ink)}
.chip.sel{background:var(--p700);color:#fff;border-color:var(--p700)}
.chip.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.chip.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.selfrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.selfrow:last-child{border:0}
.lvkey{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;margin:6px 0 12px}
.lvkey span{background:var(--p50);border-radius:8px;padding:2px 8px}

/* Survey */
.rate{padding:12px 0;border-bottom:1px dashed var(--line)}
.rate p{font-weight:700;margin-bottom:8px}
.scale{display:flex;gap:6px}
.scale .chip{flex:1;padding:10px 0;font-size:17px}

/* Cert */
.certbox{background:#fff;border-radius:16px;padding:10px;border:1px solid var(--line)}
.certbox img{width:100%;height:auto;display:block;border-radius:8px}
.lockbox{text-align:center;padding:30px 16px}
.lockbox .ic{width:70px;height:70px;border-radius:50%;background:var(--p100);color:var(--p700);display:grid;place-items:center;margin:0 auto 10px}
.slogan{font-family:var(--serif);font-size:clamp(20px,3.6vw,27px);text-align:center;color:var(--p800);line-height:1.8;padding:14px 8px}
.slogan:before,.slogan:after{content:"";display:block;width:90px;height:2px;margin:10px auto;background:linear-gradient(90deg,transparent,var(--g500),transparent)}
.status{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:800}
.status.sent{background:var(--okbg);color:var(--ok)}
.status.failed{background:var(--badbg);color:var(--bad)}
.status.pending{background:var(--warnbg);color:var(--warn)}
.smsprev{overflow-wrap:anywhere;word-break:break-word;background:var(--p50);border:1px dashed var(--p600);border-radius:12px;padding:12px;font-size:14.5px;white-space:pre-wrap}

/* Footer */
footer{background:var(--p900);color:#cfc6ea;padding:22px 0;font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
footer button{background:none;border:1px solid rgba(230,207,148,.4);color:var(--g300);border-radius:10px;padding:6px 12px;cursor:pointer}

/* Toast / modal */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--p900);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--sh);opacity:0;transition:all .3s;z-index:60;max-width:92vw;font-weight:700}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(20,10,45,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:var(--sh)}

/* Admin */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.svgchart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:5px;vertical-align:-1px}
.list{margin:0;padding-right:18px}
.list li{margin-bottom:6px}
.adminTbl td,.adminTbl th{white-space:nowrap}

#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;inset:0}
  .top,footer{display:none}
  @page{margin:12mm}
  body.print-cert #printArea img{width:100%;height:auto}
  body.print-cert @page{size:A4 landscape;margin:0}
}
#printArea .rep h1{font-size:24px;color:#2c1762;font-family:var(--font)}
#printArea .rep table{width:100%;border-collapse:collapse;font-size:12px}
#printArea .rep th,#printArea .rep td{border:1px solid #ccc;padding:5px;text-align:right}
#printArea .rep th{background:#2c1762;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printArea .rep .k{display:inline-block;border:1px solid #ddd;border-radius:8px;padding:6px 10px;margin:3px;font-size:13px}

@media (max-width:600px){
  .card{padding:18px}
  .hero{padding:28px 18px 24px}
  .pair,.gap3{grid-template-columns:1fr}
  .bar{grid-template-columns:80px 1fr 48px}
  .wbar{grid-template-columns:1fr 60px 36px}
  .selfrow{grid-template-columns:1fr}
  .qtext{font-size:17px}
  .navbar .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<h3>مثال تطبيقي لتحليل فجوة</h3>
<div class="tscroll"><table class="tbl"><tr><th>البند</th><th>المحتوى</th></tr>
<tr><td>المعيار المستهدف</td><td>تحسين نتائج المتعلمين</td></tr>
<tr><td>الوضع الحالي</td><td>تنوع الأنشطة الصفية والالتزام بتنفيذ الدروس</td></tr>
<tr><td>نقاط القوة</td><td>انتظام الحضور، وتنوع الأنشطة الصفية</td></tr>
<tr><td>ما يحتاج إلى تحسين</td><td>التشخيص المبكر للصعوبات، والخطط العلاجية الفردية</td></tr>
<tr><td>المطلوب للوصول</td><td>تشخيص مبكر، خطة دعم، قياس نتائج التدخل</td></tr></table></div>`},
{t:"تحديد جوانب القوة وفرص التحسين",h:`
<p>القوة تُبنى عليها، وفرص التحسين تُعالج بخطوة محددة. استعن بأربع خطوات لتحويل الملاحظة إلى تحسين:</p>
<div class="grid g4"><div class="goal"><span class="ic">1</span><div><b>حدد العنصر</b><br><span class="mut">جانب الأداء الذي يتطلب تطويرًا.</span></div></div><div class="goal"><span class="ic">2</span><div><b>صف الوضع الحالي</b><br><span class="mut">بدرجة التمكن وشاهد يوضح الفجوة.</span></div></div><div class="goal"><span class="ic">3</span><div><b>اختر الإجراء</b><br><span class="mut">ممارسة تدريسية أو دعم مهني مناسب.</span></div></div><div class="goal"><span class="ic">4</span><div><b>اتفق على القياس</b><br><span class="mut">مؤشر وموعد لقياس التحسن.</span></div></div></div>
<h3>ستة أخطاء تجنّبها</h3>
<ul><li><b>الانتظار للنهاية:</b> تأجيل مراجعة أدائك حتى التقييم الختامي.</li><li><b>شواهد بلا صلة:</b> ملفات كثيرة لا ترتبط بعناصر الأداء.</li><li><b>تجاهل أثر التعلم:</b> عرض أنشطة دون بيان ما تعلّمه الطلاب.</li><li><b>الدفاع عن كل ملاحظة:</b> التبرير بدل الفهم.</li><li><b>خطة دون قياس:</b> إجراء بلا مؤشر نجاح.</li><li><b>توثيق متأخر:</b> تأجيل حفظ الشواهد.</li></ul>
<h3>استفد من زملائك</h3><p>الزيارات التبادلية، والدرس التطبيقي، ومجتمعات التعلم المهني، وطلب التغذية الراجعة من زميل متمرس. <b>اختر ممارسة واحدة، طبّقها، وراقب أثرها.</b></p>`},
{t:"بناء خطط التطوير المهني (IDP)",h:`
<p><b>خطة التطوير الفردية</b> تهدف إلى تطوير مهاراتك التدريسية ومعارفك لتحسين أدائك؛ تختار فيها أولوية بالاتفاق مع مديرك، وتحدد الإجراء والوقت، وتتابع أثرها في ممارستك ونتائج طلابك.</p>
<h3>نموذج 70–20–10</h3>
<div class="split"><div style="background:var(--p700)"><b>70%</b>التعلم بالتجربة والممارسة</div><div style="background:var(--g600)"><b>20%</b>من الآخرين</div><div style="background:#8a7fa8"><b>10%</b>مباشر</div></div>
<p class="mut">جرّب أسلوبًا جديدًا وراقب أثره (70%) · زيارة تبادلية وتغذية راجعة (20%) · دورة قصيرة وقراءة مهنية (10%).</p>
<h3>مثال: خطة تطوير فردية</h3>
<div class="tscroll"><table class="tbl"><tr><th>الهدف التطويري</th><th>النشاط</th><th>المسار</th><th>الدعم</th><th>معيار النجاح</th></tr>
<tr><td>تحسين التشخيص المبكر</td><td>تصميم اختبار تشخيصي وتطبيقه</td><td>70% تجربة</td><td>زميل التخصص</td><td>خطة دعم للمجموعة</td></tr>
<tr><td>تنويع استراتيجيات التدريس</td><td>حضور درس تطبيقي لزميل</td><td>20% من الآخرين</td><td>زميل متميز</td><td>تطبيق طريقتين وقياس أثرهما</td></tr>
<tr><td>توظيف التقنية</td><td>دورة على منصة التدريب</td><td>10% مباشر</td><td>منصة التدريب</td><td>نشاط رقمي يخدم هدف التعلم</td></tr></table></div>`},
{t:"صياغة أهداف تطويرية قابلة للقياس",h:`
<p>الهدف الجيد <b>ذكي (SMART)</b>: محدد، قابل للقياس، قابل للتحقيق، مرتبط بعنصر أداء، ومحدد بزمن.</p>
<div class="grid g4" style="margin:10px 0">${[["محدد","ماذا ولمن؟"],["قابل للقياس","رقم أو نسبة"],["قابل للتحقيق","واقعي بمواردك"],["مرتبط","بعنصر أداء"],["محدد بزمن","موعد واضح"]].map(x=>`<div class="goal" style="display:block;text-align:center"><b style="color:var(--p700)">${x[0]}</b><br><span class="mut">${x[1]}</span></div>`).join("")}</div>
<div class="pair"><div class="w"><small>هدف عام</small>«أن أتحسن في متابعة الطلاب الضعاف».</div><div class="s"><small>هدف قابل للقياس</small>«رفع نسبة إتقان مهارة الاستنتاج لدى طلاب الصف الخامس من 55% إلى 75% بنهاية الفصل الدراسي، عبر نشاط علاجي أسبوعي».</div></div>
<h3>مثال خطة تحسين قصيرة</h3>
<div class="tscroll"><table class="tbl"><tr><th>الخطوة</th><th>الزمن</th><th>المعلم والداعم</th><th>مؤشر الأداء</th></tr>
<tr><td>اختبار تشخيصي قصير في الفهم القرائي</td><td>الأسبوع 2</td><td>المعلم + زميل التخصص</td><td>تحديد المجموعة المستهدفة</td></tr>
<tr><td>تصميم خطة دعم للمجموعة</td><td>الأسبوع 3</td><td>المعلم + الموجّه الطلابي</td><td>خطة قابلة للتنفيذ</td></tr>
<tr><td>نشاط علاجي أسبوعي</td><td>الأسابيع 4–10</td><td>المعلم</td><td>تحسن أداء المجموعة</td></tr>
<tr><td>إعادة القياس ومراجعة الخطة</td><td>الأسبوع 11</td><td>المعلم + المدير المباشر</td><td>مقارنة النتائج قبل وبعد</td></tr></table></div>`},
{t:"دور التغذية الراجعة في تحسين الأداء",h:`
<p>التغذية الراجعة جسر بين الملاحظة والتحسين. استفد منها بأربع خطوات:</p>
<div class="grid g4"><div class="goal"><span class="ic">1</span><div><b>اطلب التحديد</b><br><span class="mut">اسأل عن مثال أو موقف يوضح الملاحظة.</span></div></div><div class="goal"><span class="ic">2</span><div><b>افهم صلتها</b><br><span class="mut">اربطها بممارستك أو بنتائج التعلم.</span></div></div><div class="goal"><span class="ic">3</span><div><b>حدد خطوة</b><br><span class="mut">إجراء عملي قابل للتنفيذ.</span></div></div><div class="goal"><span class="ic">4</span><div><b>تابع أثرها</b><br><span class="mut">راجع التقدم واطلب ملاحظة لاحقة.</span></div></div></div>
<h3>الملاحظة المفيدة والملاحظة العامة</h3>
<div class="pair"><div class="w"><small>عامة</small>«أداؤك مقبول، حاول أن تتحسن» — لا تحدد المطلوب.</div><div class="s"><small>مفيدة</small>«ارتفع إتقان الطلاب للاستنتاج؛ فلنطبق الأسلوب في التلخيص» — محددة ومرتبطة بنتيجة.</div></div>
<div class="pair"><div class="w"><small>عامة</small>«تواصلك مع أولياء الأمور ضعيف» — حكم دون شاهد.</div><div class="s"><small>مفيدة</small>«تواصلت مع 8 من 30 وليّ أمر؛ جرّب خطة تواصل أسبوعية» — واقع وإجراء.</div></div>
<h3>إذا لم تتفق مع ملاحظة؟</h3><p>اطلب أمثلة واضحة، وقدّم شواهدك بهدوء، وركّز على ما يمكن تحسينه.</p>`}
];

function defDB(){return{records:{},current:null,certSeq:0,smsLog:[],settings:{pinHash:null,adminPhone:"966555530329",publicUrl:"",sms:{enabled:false,endpoint:"",apiKey:"",authHeader:"Authorization",authPrefix:"Bearer ",sender:"",body:'{"to":"{to}","message":"{message}","sender":"{sender}"}',autoParticipant:true,autoAdmin:false}}}}
let STORAGE_OK=true;
function load(){try{const s=localStorage.getItem(DB_KEY);if(!s)return defDB();const d=JSON.parse(s);const b=defDB();d.settings=Object.assign(b.settings,d.settings||{});d.settings.sms=Object.assign(b.settings.sms,(d.settings&&d.settings.sms)||{});d.records=d.records||{};d.smsLog=d.smsLog||[];return d}catch(e){STORAGE_OK=false;return defDB()}}
function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB))}catch(e){if(STORAGE_OK){STORAGE_OK=false;toast("تعذّر الحفظ التلقائي في هذا المتصفح؛ لا تغلق الصفحة قبل الإتمام.")}}}
let DB=load();
let VIEW="journey", ADMIN_OK=false, ADMIN_TAB="results", ACT_TAB=0, LESSON=null;

const cur=()=>DB.current?DB.records[DB.current]:null;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=(s,t)=>Math.round((s/t)*100);
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function normPhone(p){p=String(p||"").replace(/[\s\-()]/g,"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));if(/^\+9665\d{8}$/.test(p))return p.slice(1);if(/^009665\d{8}$/.test(p))return p.slice(2);if(/^9665\d{8}$/.test(p))return p;if(/^05\d{8}$/.test(p))return"966"+p.slice(1);if(/^5\d{8}$/.test(p))return"966"+p;return null}
const showPhone=p=>p?("0"+p.slice(3)):"";
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),3200)}
function fmtDate(iso){const d=new Date(iso);let g=d.toLocaleDateString("ar-SA-u-ca-gregory-nu-latn",{year:"numeric",month:"long",day:"numeric"});let h="";try{h=d.toLocaleDateString("ar-SA-u-ca-islamic-umalqura-nu-latn",{year:"numeric",month:"long",day:"numeric"})}catch(e){}return{g,h}}
function isDone(r,k){return!!(r&&r.done&&r.done[k])}
function allDone(r){return REQ.every(k=>isDone(r,k))}
function canEnter(r,i){if(i===0)return true;if(!r)return false;for(let j=0;j<i&&j<REQ.length;j++)if(!isDone(r,REQ[j]))return false;return true}
function progressOf(r){if(!r)return 0;return Math.round(REQ.filter(k=>isDone(r,k)).length/REQ.length*100)}
function avgRating(r){if(!r||!r.survey)return null;const a=r.survey.ratings;return a.reduce((x,y)=>x+y,0)/a.length}

   الرسم العام
========================================================= */
function renderTop(){
  const r=cur(),p=progressOf(r),v=r?r.view:0;
  let st="";
  if(VIEW==="journey"){
    st=`<div class="stations" role="navigation" aria-label="محطات الورشة">${ST.map((s,i)=>{const ok=canEnter(r,i);const dn=i<REQ.length?isDone(r,REQ[i]):allDone(r);return `<button class="st ${dn?"done":""} ${i===v?"on":""} ${ok?"":"lock"}" data-act="go" data-i="${i}" ${ok?"":'aria-disabled="true"'}><span class="n">${dn?ic("check",13,3):(ok?i+1:ic("lock",12,2.4))}</span>${s.t}</button>`}).join("")}</div>`;
  }
  document.getElementById("top").innerHTML=`<div class="wrap"><div class="brand">${compassLogo(40)}<div style="min-width:0"><b>${TITLE}</b><small>${VIEW==="admin"?"لوحة النتائج والتحليل · "+SCHOOL:SCHOOL+" · المراجعة النصف سنوية"}</small></div></div>${VIEW==="journey"&&r?`<span class="pct-pill">الإنجاز ${p}%</span>`:""}${VIEW==="admin"?`<button class="btn sm ghost" data-act="exitAdmin">${ic("logout",16)} خروج</button>`:""}</div>${VIEW==="journey"?`<div class="progress"><i style="width:${p}%"></i></div>`:""}${st}`;
  const on=document.querySelector(".st.on");if(on)on.scrollIntoView({inline:"center",block:"nearest"});
}
function render(){
  renderTop();
  const app=document.getElementById("app");
  if(VIEW==="verify"){app.innerHTML=renderVerify();return}
  if(VIEW==="admin"){app.innerHTML=renderAdmin();afterAdmin();return}
  const r=cur();const v=r?r.view:0;
  const fn=[renderStart,()=>renderTest("pre"),renderLearn,renderPractice,renderPlan,()=>renderTest("post"),renderSurvey,renderFinish][v];
  app.innerHTML=`<div class="fade">${fn()}</div>`;
  if(v===7)drawCertPreview();
}
function shead(i,sub){const s=ST[i];return `<div class="shead"><div class="badge">${ic(s.ic,28)}</div><div><small>المحطة ${["الأولى","الثانية","الثالثة","الرابعة","الخامسة","السادسة","السابعة","الثامنة"][i]}</small><h2>${s.t}</h2>${sub?`<div class="mut">${sub}</div>`:""}</div></div>`}
function navbar(i,nextOk,nextLabel){const r=cur();return `<div class="navbar"><button class="btn ghost" data-act="go" data-i="${i-1}" ${i<=0?"disabled":""}>${ic("back",18)} المحطة السابقة</button><button class="btn pri" data-act="go" data-i="${i+1}" ${nextOk?"":"disabled"}>${nextLabel||"المحطة التالية"} ${ic("next",18)}</button></div>`}
function go(i){const r=cur();i=+i;if(i<0||i>7)return;if(!r){return}if(!canEnter(r,i)){toast("أكمل متطلبات المحطة الحالية أولًا");return}r.view=i;LESSON=null;save();render();window.scrollTo({top:0,behavior:"smooth"})}

/* ---------- المحطة 1 ---------- */
function renderStart(){
  const r=cur();
  const journey=[["flag","بوابة الانطلاق","التعريف والتسجيل"],["gauge","قياس المعرفة","اختبار قبلي (10 أسئلة)"],["compass","اكتشف وتعلّم","10 محطات معرفية"],["puzzle","اختبر ممارستك","مواقف وأنشطة تطبيقية"],["target","خطتي نحو التميز","خطة تطوير فردية"],["chart","اختبر تطورك","اختبار بعدي ومقارنة"],["star","قيّم التجربة","استبيان الرضا"],["award","احصد إنجازك","شهادة ونتائج"]];
  const goals=["فهم مفهوم المراجعة النصف سنوية وموقعها في دورة الأداء.","التعرف على عناصر نموذج أداء المعلم الأحد عشر وأوزانها ومستوياتها.","اختيار الشواهد المهنية المرتبطة بالعناصر والتي تُظهر الأثر.","تحليل الإنجازات وتحديد جوانب القوة وفرص التحسين.","بناء خطة تطوير فردية بأهداف قابلة للقياس.","توظيف التغذية الراجعة في تحسين الممارسة."];
  let form;
  if(r&&isDone(r,"start")){
    form=`<div class="card"><h2>مرحبًا ${esc(r.name)} 👋</h2><p class="mut">سجلك محفوظ على هذا الجهاز، ونسبة إنجازك ${progressOf(r)}%.</p><div class="btns"><button class="btn pri" data-act="resume">${ic("next",18)} متابعة الرحلة</button><button class="btn ghost" data-act="newUser">${ic("user",18)} لست ${esc(r.name)}؟ تسجيل مشارك جديد</button></div></div>`;
  }else{
    form=`<div class="card" id="reg"><h2>${ic("user",22)} سجّل بياناتك للبدء</h2><p class="mut">تُستخدم بياناتك لإصدار شهادتك وإرسال نتيجتك إليك فقط، ولا تظهر لأي مشارك آخر.</p>
    <label class="f" for="fName">الاسم الثلاثي (كما سيظهر في الشهادة)</label><input class="in" id="fName" autocomplete="name" maxlength="60" placeholder="مثال: عبدالله محمد الزهراني">
    <div id="eName" class="errmsg"></div>
    <label class="f" for="fGender">الصفة</label><select class="in" id="fGender"><option value="m">المعلم</option><option value="f">المعلمة</option></select>
    <label class="f" for="fPhone">رقم الجوال</label><input class="in" id="fPhone" inputmode="tel" autocomplete="tel" dir="ltr" style="text-align:right" placeholder="05xxxxxxxx">
    <div class="hint">يُقبل الرقم السعودي بصيغة 05xxxxxxxx أو 9665xxxxxxxx.</div><div id="ePhone" class="errmsg"></div>
    <label class="check"><input type="checkbox" id="fPrivacy"><span>أوافق على حفظ بياناتي ونتائجي لأغراض الورشة، واطلاع إدارة المدرسة عليها.</span></label>
    <label class="check"><input type="checkbox" id="fSms" checked><span>أوافق على استقبال رسالة نصية بنتيجتي ورابط شهادتي على رقم جوالي.</span></label>
    <div id="ePriv" class="errmsg"></div>
    <div class="btns" style="margin-top:16px"><button class="btn gold" data-act="register">${ic("flag",18)} ابدأ الرحلة</button></div></div>`;
  }
  return `<section class="hero"><svg class="bg-compass" viewBox="0 0 64 64">${compassLogo(64).replace(/<\/?svg[^>]*>/g,"")}</svg><div class="eyebrow" style="color:var(--g300)">${ic("compass",16)} ورشة تدريبية إلكترونية تفاعلية</div><h1>${TITLE}</h1><div class="sub">${SUBTITLE}</div><div class="quote">«راجع إنجازك، اكتشف فرصك، واصنع خطوتك القادمة»</div><div class="meta">${SCHOOL} · مدير المدرسة: ${PRINCIPAL} · الفئة المستهدفة: المعلمون والمعلمات</div></section>
  ${form}
  <div class="card"><div class="eyebrow">${ic("target",16)} أهداف الورشة</div><h2>ماذا ستحقق في هذه الرحلة؟</h2><div class="grid g2">${goals.map((g,i)=>`<div class="goal"><span class="ic">${i+1}</span><div>${g}</div></div>`).join("")}</div></div>
  <div class="card"><div class="eyebrow">${ic("compass",16)} مسار الرحلة</div><h2>ثماني محطات متتابعة</h2><p class="mut">تنتقل بين المحطات بالتسلسل، ويُحفظ تقدمك تلقائيًا، وتصدر شهادتك بعد إكمال الاختبار البعدي وتقييم الورشة.</p><div class="journey">${journey.map(j=>`<div class="jstep"><div class="ic">${ic(j[0],22)}</div><b>${j[1]}</b><span>${j[2]}</span></div>`).join("")}</div></div>`;
}
function register(){
  const name=document.getElementById("fName").value.trim().replace(/\s+/g," ");
  const phoneRaw=document.getElementById("fPhone").value;const phone=normPhone(phoneRaw);
  const gender=document.getElementById("fGender").value;
  const priv=document.getElementById("fPrivacy").checked,sms=document.getElementById("fSms").checked;
  let ok=true;
  const set=(id,m,inp)=>{document.getElementById(id).textContent=m;if(inp)document.getElementById(inp).classList.toggle("err",!!m)};
  if(name.split(" ").length<2||name.length<6||!/^[؀-ۿa-zA-Z\s.'-]+$/.test(name)){set("eName","اكتب اسمك الثنائي أو الثلاثي بحروف صحيحة.","fName");ok=false}else set("eName","","fName");

function participantMsg(r){const a=avgRating(r);return `مرحبًا ${r.name}،\nأتممتَ ورشة «${TITLE}» بنجاح.\nالاختبار القبلي: ${r.pre.score}/10 (${r.pre.pct}%)\nالاختبار البعدي: ${r.post.score}/10 (${r.post.pct}%)\nنسبة التحسن: ${r.post.pct-r.pre.pct>0?"+":""}${r.post.pct-r.pre.pct} نقطة مئوية\nتقييمك للورشة: ${a.toFixed(1)}/5\nرابط شهادتك: ${verifyUrl(r)}\n${SCHOOL}`}
function adminMsg(){const s=stats();return `تقرير ورشة «${TITLE}» — ${SCHOOL}\nالمشاركون: ${s.n} | المكملون: ${s.c}\nمتوسط القبلي: ${s.pre}% | متوسط البعدي: ${s.post}%\nنسبة التحسن: ${s.imp>0?"+":""}${s.imp} نقطة مئوية\nمتوسط التقييم: ${s.rate}/5 | نسبة الرضا: ${s.sat}%`}
function smsConfigured(){const s=DB.settings.sms;return s.enabled&&/^https:\/\//.test(s.endpoint)}
async function sendSms(to,message,meta){
  const entry={id:uid(),at:new Date().toISOString(),to,kind:meta.kind,recId:meta.recId||null,name:meta.name||"",status:"pending",note:""};
  DB.smsLog.push(entry);
  if(!to){entry.status="failed";entry.note="لا يوجد رقم مستلم";save();return entry}
  if(!smsConfigured()){entry.status="not_configured";entry.note="لم تُربط بوابة الرسائل بعد";save();return entry}
  const s=DB.settings.sms;const jesc=v=>JSON.stringify(String(v)).slice(1,-1);
  const body=s.body.replace(/\{to\}/g,jesc(to)).replace(/\{message\}/g,jesc(message)).replace(/\{sender\}/g,jesc(s.sender));
  const headers={"Content-Type":"application/json"};if(s.apiKey&&s.authHeader)headers[s.authHeader]=(s.authPrefix||"")+s.apiKey;
  try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),15000);const res=await fetch(s.endpoint,{method:"POST",headers,body,signal:ctl.signal});clearTimeout(tm);
    if(res.ok){entry.status="sent";entry.note="قبلت البوابة الطلب (HTTP "+res.status+")"}else{entry.status="failed";entry.note="رفضت البوابة الطلب (HTTP "+res.status+")"}}
  catch(e){entry.status="failed";entry.note=e.name==="AbortError"?"انتهت مهلة الاتصال":"تعذّر الاتصال بالبوابة (شبكة أو CORS)"}
  save();return entry;
}
async function autoSms(r){
  const s=DB.settings.sms;
  if(r.smsConsent&&s.autoParticipant){const e=await sendSms(r.phone,participantMsg(r),{kind:"participant",recId:r.id,name:r.name});if(VIEW==="journey"&&cur()===r&&r.view===7){render()}if(e.status==="sent")toast("أُرسلت نتيجتك إلى جوالك")}
  if(s.autoAdmin&&DB.settings.adminPhone)sendSms(DB.settings.adminPhone,adminMsg(),{kind:"admin"});
}

const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function stats(){
  const R=recs(),C=R.filter(allDone),pre=R.filter(r=>r.pre),post=R.filter(r=>r.post),sv=R.filter(r=>r.survey);
  const both=R.filter(r=>r.pre&&r.post);
  const allRatings=sv.flatMap(r=>r.survey.ratings);
  const itemAvg=SURVEY.map((_,k)=>avg(sv.map(r=>r.survey.ratings[k])));
  const dist=[1,2,3,4,5].map(v=>allRatings.filter(x=>x===v).length);
  return{n:R.length,c:C.length,pre:Math.round(avg(pre.map(r=>r.pre.pct))),post:Math.round(avg(post.map(r=>r.post.pct))),imp:Math.round(avg(both.map(r=>r.post.pct-r.pre.pct))),rate:(avg(sv.map(avgRating))||0).toFixed(2),sat:allRatings.length?Math.round(allRatings.filter(x=>x>=4).length/allRatings.length*100):0,itemAvg,dist,sv,both,R};
}

function chartPrePost(s){
  const R=s.both.slice(-12);if(!R.length)return '<p class="mut">لا توجد بيانات مقارنة بعد.</p>';
  const W=560,H=260,pad=36,n=R.length+1,bw=(W-pad*2)/n;let g="";
  for(let y=0;y<=100;y+=25){const yy=H-pad-(H-pad*2)*y/100;g+=`<line x1="${pad}" x2="${W-10}" y1="${yy}" y2="${yy}" stroke="#e6e1f0"/><text x="${pad-6}" y="${yy+4}" font-size="11" text-anchor="end" fill="#6b6580">${y}%</text>`}
  const bars=[["المتوسط",s.pre,s.post]].concat(R.map(r=>[r.name.split(" ")[0],r.pre.pct,r.post.pct]));
  bars.forEach((b,i)=>{const x=W-10-(i+1)*bw;const h1=(H-pad*2)*b[1]/100,h2=(H-pad*2)*b[2]/100;const w=bw*.34;
    g+=`<rect x="${x+bw*.14}" y="${H-pad-h1}" width="${w}" height="${h1}" rx="3" fill="#b9add6"><title>${esc(b[0])} قبلي ${b[1]}%</title></rect><rect x="${x+bw*.14+w+2}" y="${H-pad-h2}" width="${w}" height="${h2}" rx="3" fill="${i?"#5332a6":"#c9a24a"}"><title>${esc(b[0])} بعدي ${b[2]}%</title></rect><text x="${x+bw/2}" y="${H-pad+16}" font-size="11" text-anchor="middle" fill="${i?"#1d1830":"#a8842f"}" font-weight="${i?400:700}">${esc(b[0].slice(0,9))}</text>`});
  return `<svg class="svgchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="مقارنة النتائج القبلية والبعدية">${g}</svg><div class="legend"><span><i style="background:#b9add6"></i>قبلي</span><span><i style="background:#5332a6"></i>بعدي</span><span><i style="background:#c9a24a"></i>متوسط البعدي</span></div>`;
}
function chartDist(s){
  const tot=s.dist.reduce((a,b)=>a+b,0);if(!tot)return '<p class="mut">لا توجد تقييمات بعد.</p>';
  const cols=["#b3261e","#c77b30","#a8842f","#5332a6","#2c1762"],labels=["1 منخفض جدًا","2 منخفض","3 متوسط","4 مرتفع","5 مرتفع جدًا"];
  let ang=-Math.PI/2,paths="";const cx=110,cy=110,R=95,r0=58;
  s.dist.forEach((v,i)=>{if(!v)return;const a=v/tot*Math.PI*2;const a2=ang+a;const lg=a>Math.PI?1:0;const p=(rr,t)=>`${cx+rr*Math.cos(t)},${cy+rr*Math.sin(t)}`;
    paths+=a>=Math.PI*2-1e-6?`<circle cx="${cx}" cy="${cy}" r="${(R+r0)/2}" fill="none" stroke="${cols[i]}" stroke-width="${R-r0}"/>`:`<path d="M${p(R,ang)} A${R},${R} 0 ${lg} 1 ${p(R,a2)} L${p(r0,a2)} A${r0},${r0} 0 ${lg} 0 ${p(r0,ang)}Z" fill="${cols[i]}"><title>${labels[i]}: ${v}</title></path>`;ang=a2});
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="توزيع مستويات الرضا">${paths}<text x="110" y="108" text-anchor="middle" font-size="30" font-weight="800" fill="#2c1762">${s.sat}%</text><text x="110" y="130" text-anchor="middle" font-size="12" fill="#6b6580">نسبة الرضا</text></svg><div>${labels.map((l,i)=>`<div style="font-size:14px;margin:4px 0"><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${cols[i]};margin-left:6px"></i>${l}: <b>${s.dist[i]}</b> (${Math.round(s.dist[i]/tot*100)}%)</div>`).join("")}</div></div>`;

/* ---------- Excel (xlsx) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  for(const f of files){const name=enc.encode(f.name),data=typeof f.data==="string"?enc.encode(f.data):f.data,crc=crc32(data);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(lh,name,data);cd.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);off+=lh.length+name.length+data.length}
  const cdSize=cd.reduce((s,b)=>s+b.length,0);const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts,...cd,end],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}
function xlsx(sheets){
  const xe=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");
  const col=i=>{let s="";i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
  const files=[];
  sheets.forEach((sh,si)=>{const widths=sh.rows[0].map((_,c)=>Math.min(60,Math.max(10,...sh.rows.map(r=>String(r[c]==null?"":r[c]).length+2))));
    const rows=sh.rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>{const ref=col(ci)+(ri+1);if(v===null||v===undefined||v==="")return "";if(typeof v==="number"&&isFinite(v))return `<c r="${ref}"${ri===0?' s="1"':""}><v>${v}</v></c>`;return `<c r="${ref}" t="inlineStr"${ri===0?' s="1"':""}><is><t xml:space="preserve">${xe(v)}</t></is></c>`}).join("")}</row>`).join("");
    files.push({name:`xl/worksheets/sheet${si+1}.xml`,data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${rows}</sheetData></worksheet>`})});
  files.unshift(
   {name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`},
   {name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
   {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xe(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`},
   {name:"xl/_rels/workbook.xml.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
   {name:"xl/styles.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF2C1762"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`});
  return zip(files);
}
function exportXlsx(){
  const s=stats();
  const people=[["#","الاسم","الجوال","الإنجاز %","القبلي (من 10)","القبلي %","البعدي (من 10)","البعدي %","التحسن (نقطة مئوية)","متوسط التقييم","رقم الشهادة","تاريخ الإتمام","العنصر المستهدف","الهدف التطويري","المؤشر"]].concat(s.R.map((r,i)=>[i+1,r.name,showPhone(r.phone),progressOf(r),r.pre?r.pre.score:"",r.pre?r.pre.pct:"",r.post?r.post.score:"",r.post?r.post.pct:"",r.pre&&r.post?r.post.pct-r.pre.pct:"",r.survey?+avgRating(r).toFixed(2):"",r.certNo||"",r.completedAt?r.completedAt.slice(0,10):"",r.plan&&r.plan.element!==undefined&&r.plan.element!==""?ELEMENTS[+r.plan.element][0]:"",r.plan?r.plan.goal||"":"",r.plan?r.plan.indicator||"":""]));
  const summary=[["المؤشر","القيمة"],["عدد المشاركين",s.n],["عدد من أكملوا الورشة",s.c],["متوسط الاختبار القبلي %",s.pre],["متوسط الاختبار البعدي %",s.post],["متوسط التحسن (نقطة مئوية)",s.imp],["متوسط تقييم الورشة (من 5)",+s.rate],["نسبة الرضا العام %",s.sat]].concat(SURVEY.map((q,k)=>["متوسط بند: "+q,+s.itemAvg[k].toFixed(2)]));
  const survey=[["الاسم",...SURVEY,...OPENQ]].concat(s.sv.map(r=>[r.name,...r.survey.ratings,...r.survey.open]));
  const sms=[["الوقت","النوع","المستلم","الحالة","ملاحظة"]].concat(DB.smsLog.map(l=>[l.at.replace("T"," ").slice(0,16),l.kind,showPhone(l.to),l.status,l.note]));
  dl(xlsx([{name:"الملخص",rows:summary},{name:"المشاركون",rows:people},{name:"تقييم الورشة",rows:survey},{name:"سجل الرسائل",rows:sms}]),`نتائج-بوصلة-الأداء-${new Date().toISOString().slice(0,10)}.xlsx`);toast("تم تصدير ملف Excel");
}
function exportPdf(){

  <h3>نتائج المشاركين</h3><table><tr><th>#</th><th>الاسم</th><th>القبلي</th><th>البعدي</th><th>التحسن</th><th>التقييم</th><th>الشهادة</th></tr>${s.R.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.pre?r.pre.pct+"%":"—"}</td><td>${r.post?r.post.pct+"%":"—"}</td><td>${r.pre&&r.post?r.post.pct-r.pre.pct:"—"}</td><td>${r.survey?avgRating(r).toFixed(1):"—"}</td><td>${r.certNo||"—"}</td></tr>`).join("")}</table>

  setTimeout(()=>window.print(),200);
}

<style>:root{--royal:#0f2a6b;--royal2:#1d4ed8;--turq:#14b8a6;--turq2:#0e9f9a;--gold:#d4a64a;--gold2:#f3d58a;--ink:#0f172a;--muted:#5b6b84;--bg:#f4f7fd;--card:#fff;--ok:#059669;--bad:#dc2626;--r:22px;--sh:0 18px 40px -18px rgba(15,42,107,.35),0 2px 6px rgba(15,42,107,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;min-height:100vh;overflow-x:hidden}
button,input,textarea,select{font-family:inherit;font-size:1rem}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* خلفية */
.sky{position:fixed;inset:0;z-index:-1;background:radial-gradient(1200px 600px at 85% -10%,#dbeafe 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#ccfbf1 0,transparent 55%),var(--bg)}
.floaters span{position:absolute;font-weight:800;opacity:.13;animation:float 9s ease-in-out infinite;user-select:none}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(8deg)}}

/* الشريط العلوي */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border-bottom:1px solid #e6ecf7}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--royal);cursor:pointer}
.brand .logo{min-width:38px;height:38px;padding:0 10px;font-size:.95rem;font-weight:900;border-radius:12px;background:linear-gradient(135deg,var(--royal),var(--royal2) 55%,var(--turq));display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px -6px var(--royal2)}
.brand small{display:block;font-size:.72rem;color:var(--turq2);font-weight:700;line-height:1}
.top-prog{flex:1;display:flex;align-items:center;gap:10px;justify-content:flex-end}
.pbar{height:10px;background:#e5ebf6;border-radius:99px;overflow:hidden;width:min(260px,40vw)}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--turq),var(--royal2),var(--gold));border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.pct{font-weight:800;color:var(--royal);font-size:.9rem;min-width:42px}
.who{font-size:.8rem;color:var(--muted);background:#eef3fc;border-radius:99px;padding:4px 12px;white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis}

/* البطل */
.hero{position:relative;padding:44px 0 30px;text-align:center}
.hero-card{position:relative;overflow:hidden;border-radius:34px;padding:46px 22px 40px;background:linear-gradient(140deg,#0b1f55 0%,#14348f 45%,#0f766e 100%);color:#fff;box-shadow:0 40px 80px -40px #0b1f55}
.hero-card:before{content:"";position:absolute;inset:0;background:radial-gradient(500px 240px at 80% 0,rgba(243,213,138,.35),transparent 60%),radial-gradient(400px 260px at 0 100%,rgba(20,184,166,.45),transparent 60%)}
.hero-card>*{position:relative}
.crown{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(243,213,138,.5);color:var(--gold2);padding:6px 16px;border-radius:99px;font-weight:700;font-size:.85rem}
.hero h1{font-size:clamp(2.2rem,6.5vw,4.2rem);line-height:1.25;margin:16px 0 6px;font-weight:900;background:linear-gradient(180deg,#fff 30%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 8px 30px rgba(0,0,0,.15)}
.hero h2{font-size:clamp(1.15rem,3vw,1.6rem);color:#99f6e4;font-weight:700}
.motto{margin:16px auto 0;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.motto span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);padding:7px 16px;border-radius:14px;font-weight:700}
.welcome{max-width:700px;margin:22px auto 0;font-size:1.1rem;color:#e0e7ff}
.tagline{margin-top:16px;color:var(--gold2);font-weight:800;font-size:1.15rem;letter-spacing:0}
.scene{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:18px auto 0;height:170px}
.scene svg{filter:drop-shadow(0 18px 18px rgba(0,0,0,.25))}
.bob{animation:bob 4s ease-in-out infinite}.bob2{animation:bob 4.6s ease-in-out .6s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* أزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:16px;font-weight:800;transition:transform .15s,box-shadow .2s,filter .2s;color:#fff;background:linear-gradient(135deg,var(--royal2),var(--royal));box-shadow:0 12px 24px -12px var(--royal2)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.gold{background:linear-gradient(135deg,#f3d58a,#d4a64a 55%,#b7862c);color:#3b2a06;box-shadow:0 14px 28px -12px #b7862c}
.btn.turq{background:linear-gradient(135deg,var(--turq),var(--turq2))}
.btn.ghost{background:#fff;color:var(--royal);border:2px solid #d6e0f3;box-shadow:none}
.btn.sm{padding:8px 16px;border-radius:12px;font-size:.92rem}
.btn.big{padding:16px 38px;font-size:1.2rem;border-radius:20px}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center;justify-content:center}

/* بطاقات */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:26px;border:1px solid #eef2fa}
.section{padding:26px 0 60px;animation:enter .55s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.st-head{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.st-badge{width:66px;height:66px;border-radius:22px;display:grid;place-items:center;font-size:2rem;color:#fff;box-shadow:0 14px 26px -12px currentColor;flex:none;transform:perspective(300px) rotateX(10deg)}
.st-head h2{font-size:clamp(1.4rem,3.6vw,2rem);color:var(--royal);font-weight:900;line-height:1.3}
.st-head p{color:var(--muted);font-weight:600}
.h3{font-size:1.25rem;color:var(--royal);font-weight:800;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.h3:before{content:"";width:8px;height:24px;border-radius:4px;background:linear-gradient(var(--gold),var(--turq))}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.muted{color:var(--muted)}
.note{background:#fff8e6;border:1px solid #f3d58a;border-radius:16px;padding:12px 16px;color:#6b4e12;font-weight:600}
.info{background:#eef6ff;border:1px solid #cfe0fb;border-radius:16px;padding:12px 16px;color:#1e3a8a}

/* خريطة الرحلة */
.map{position:relative;padding:10px 0}
.map-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;position:relative}
@media(max-width:760px){.map-grid{grid-template-columns:repeat(2,1fr)}}
.node{position:relative;background:#fff;border-radius:24px;padding:18px 14px 16px;text-align:center;box-shadow:var(--sh);border:2px solid transparent;transition:transform .2s,border-color .2s;cursor:pointer;overflow:hidden}
.node:hover{transform:translateY(-4px)}
.node .num{position:absolute;top:10px;right:12px;font-weight:900;font-size:.8rem;color:#94a3b8}
.node .ic{width:62px;height:62px;margin:4px auto 10px;border-radius:20px;display:grid;place-items:center;font-size:1.8rem;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 12px 20px -10px currentColor}
.node b{display:block;color:var(--royal);font-size:1rem;line-height:1.4}
.node small{display:inline-block;margin-top:8px;font-weight:700;font-size:.78rem;padding:2px 10px;border-radius:99px}
.node.done{border-color:#a7f3d0}.node.done small{background:#d1fae5;color:#047857}
.node.open small{background:#e0e7ff;color:#3730a3}
.node.locked{opacity:.55;cursor:not-allowed;filter:grayscale(.6)}.node.locked small{background:#f1f5f9;color:#64748b}
.node.done:after{content:"✓";position:absolute;top:8px;left:10px;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:900;font-size:.85rem}
.milestones{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:18px}
.ms{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--sh);cursor:pointer;border:2px solid transparent}
.ms .e{font-size:1.6rem}
.ms b{color:var(--royal)}
.ms.done{border-color:#a7f3d0}.ms.locked{opacity:.55;cursor:not-allowed}

/* نماذج */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700;color:var(--royal)}
.field input,.field textarea,.field select{border:2px solid #dbe3f2;border-radius:14px;padding:12px 14px;background:#fbfcff;transition:border-color .2s,box-shadow .2s;width:100%}
.field input:focus,.field textarea:focus,.field select:focus{outline:0;border-color:var(--turq);box-shadow:0 0 0 4px rgba(20,184,166,.15)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--turq2);flex:none;margin-top:3px}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.idcard{background:linear-gradient(135deg,#0b1f55,#1d4ed8 60%,#0f766e);color:#fff;border-radius:22px;padding:22px;text-align:center}
.idcard .code{font-size:2rem;font-weight:900;letter-spacing:2px;direction:ltr;color:var(--gold2);margin:6px 0}

/* أسئلة */
.q{background:#fff;border:2px solid #e8eef8;border-radius:20px;padding:18px;margin-bottom:14px}
.q .qt{font-weight:800;color:var(--ink);margin-bottom:12px;font-size:1.06rem}
.q .tag{display:inline-block;font-size:.72rem;font-weight:800;color:var(--turq2);background:#ccfbf1;padding:2px 10px;border-radius:99px;margin-bottom:6px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;padding:12px 14px;border-radius:14px;background:#f6f8fd;border:2px solid #e3e9f5;color:var(--ink);font-weight:600;transition:all .15s;width:100%}
.opt:hover{border-color:#b7c7ea;background:#eef3fd}
.opt .l{width:30px;height:30px;border-radius:10px;background:#fff;border:2px solid #d6e0f3;display:grid;place-items:center;font-weight:800;color:var(--royal);flex:none}
.opt.sel{border-color:var(--royal2);background:#e8efff}.opt.sel .l{background:var(--royal2);color:#fff;border-color:var(--royal2)}
.opt.right{border-color:#34d399;background:#ecfdf5}.opt.right .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:#fca5a5;background:#fef2f2}.opt.wrong .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{margin-top:10px;padding:10px 14px;border-radius:12px;font-weight:700;animation:enter .3s}
.fb.ok{background:#ecfdf5;color:#065f46}.fb.no{background:#fef2f2;color:#991b1b}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:#dbe3f2}.dots i.on{background:var(--royal2)}.dots i.ans{background:var(--turq)}

/* بطاقات تفاعلية */
.flip{perspective:1000px;min-height:190px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;min-height:190px;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .ba{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px}
.flip .fa{background:linear-gradient(160deg,#fff,#eef4ff);border:2px solid #dbe5f7}
.flip .ba{background:linear-gradient(160deg,#0f2a6b,#0f766e);color:#fff;transform:rotateY(180deg);font-weight:600;font-size:.95rem}
.flip .fa .e{font-size:2.2rem}.flip .fa b{color:var(--royal);font-size:1.08rem}
.flip .hint{font-size:.75rem;color:var(--turq2);font-weight:700}
.hex{background:#fff;border-radius:22px;padding:18px;border:2px solid #e3eaf7;cursor:pointer;transition:all .25s;position:relative}
.hex .e{font-size:2rem}.hex b{display:block;color:var(--royal);margin:4px 0}
.hex p{max-height:0;overflow:hidden;transition:max-height .5s,opacity .4s;opacity:0;color:#334155;font-size:.95rem}
.hex.on{border-color:var(--turq);background:linear-gradient(160deg,#fff,#effcfa);transform:translateY(-3px)}
.hex.on p{max-height:300px;opacity:1}
.hex .plus{position:absolute;top:12px;left:14px;width:26px;height:26px;border-radius:50%;background:#eef3fc;color:var(--royal);display:grid;place-items:center;font-weight:900;transition:transform .3s}
.hex.on .plus{transform:rotate(45deg);background:var(--turq);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:10px 16px;border-radius:14px;background:#fff;border:2px solid #dbe3f2;font-weight:800;color:var(--royal);transition:all .15s;user-select:none}
.chip.used{opacity:.3;pointer-events:none}
.chip.sel{background:var(--royal2);color:#fff;border-color:var(--royal2)}
.slot{min-height:64px;border:2px dashed #b9c7e4;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f8faff}
.slot.ok{border-color:#34d399;background:#ecfdf5}.slot.no{border-color:#fca5a5;background:#fef2f2}

/* القراءة */
.reader{background:linear-gradient(180deg,#fffdf6,#fff);border:2px solid #f3e3b5;border-radius:22px;padding:22px;font-size:1.15rem;line-height:2.1;position:relative}
.reader .ttl{font-weight:900;color:#8a5a00;font-size:1.25rem;margin-bottom:6px;display:flex;gap:10px;align-items:center}
.reader .ttl small{font-size:.75rem;background:#fde68a;color:#7c4a03;border-radius:99px;padding:2px 10px}
.sent{border-radius:8px;padding:2px 4px;transition:background .3s}
.sent.hl{background:#fde68a;box-shadow:0 0 0 2px #fbbf24}
.sent.pick{cursor:pointer;background:#eef3fd;margin:2px 0;display:inline}
.sent.pick:hover{background:#dbeafe}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:640px){.steps{grid-template-columns:repeat(5,minmax(0,1fr))}.steps .s b{font-size:.85rem}.steps .s small{display:none}}
.steps .s{background:#fff;border-radius:18px;padding:14px 6px;text-align:center;border:2px solid #e3eaf7;position:relative;animation:pop .5s both}
.steps .s .e{font-size:1.6rem}.steps .s b{display:block;color:var(--royal)}.steps .s small{color:var(--muted);font-size:.78rem;line-height:1.4;display:block}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(10px)}to{opacity:1;transform:none}}
.detective{background:linear-gradient(140deg,#0b1f55,#1e3a8a);color:#fff;border-radius:24px;padding:20px;position:relative;overflow:hidden}
.detective .bd{display:flex;align-items:center;gap:14px}
.detective .mag{font-size:2.6rem;animation:bob 3s infinite}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badges i{font-style:normal;font-size:1.3rem;filter:grayscale(1);opacity:.35;transition:all .3s}
.badges i.on{filter:none;opacity:1;transform:scale(1.15)}

/* الرياضيات */
.topic{background:#fff;border-radius:16px;padding:12px 14px;border:2px solid #ece6fb;font-weight:700;color:#5b21b6;cursor:pointer;transition:all .2s}
.topic small{display:block;font-weight:500;color:#475569;max-height:0;overflow:hidden;transition:max-height .4s}
.topic.on{background:#f5f3ff;border-color:#a78bfa}.topic.on small{max-height:120px;margin-top:6px}
.stepsol{margin-top:10px;background:#f5f3ff;border-radius:14px;padding:12px 16px;border:1px dashed #a78bfa}
.stepsol li{margin:4px 22px 4px 0;animation:enter .35s both}
.mini-chart{display:flex;gap:16px;align-items:flex-end;height:120px;padding:10px;background:#faf8ff;border-radius:14px;margin:6px 0 12px}
.mini-chart div{flex:1;text-align:center;font-weight:700;font-size:.85rem;color:#4c1d95}
.mini-chart div i{display:block;margin:0 auto 4px;width:70%;background:linear-gradient(#a78bfa,#7c3aed);border-radius:10px 10px 4px 4px}

/* المسابقة */
.quizbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:linear-gradient(135deg,#7c2d12,#c2410c);color:#fff;border-radius:20px;padding:14px 18px;margin-bottom:16px}
.quizbar b{font-size:1.3rem}
.timer{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:conic-gradient(var(--gold2) var(--p,100%),rgba(255,255,255,.2) 0);position:relative}
.timer:before{content:"";position:absolute;inset:6px;border-radius:50%;background:#9a3412}
.timer span{position:relative}
.stars{color:var(--gold);font-size:1.6rem;letter-spacing:2px}
.result{text-align:center;background:linear-gradient(160deg,#fff,#fff8e6);border:2px solid #f3d58a;border-radius:26px;padding:28px}
.result .big{font-size:3.2rem;font-weight:900;color:var(--royal)}
.passage{background:#fffdf6;border-right:5px solid var(--gold);border-radius:12px;padding:10px 14px;margin-bottom:10px;color:#3b2f12}

/* الخطة */
.day{background:#fff;border-radius:20px;padding:16px;border:2px solid #e3eaf7;transition:border-color .3s}
.day.done{border-color:#86efac;background:linear-gradient(160deg,#fff,#f0fdf4)}
.day .dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.day .dn{font-weight:900;color:var(--royal);font-size:1.1rem}
.day .sk{font-weight:800;color:var(--turq2)}
.day textarea{margin-top:8px;border:2px solid #e3eaf7;border-radius:12px;padding:8px 10px;width:100%;min-height:58px;resize:vertical}
.tick{display:flex;align-items:center;gap:6px;font-weight:700;color:#047857;cursor:pointer}
.tick input{width:22px;height:22px;accent-color:var(--ok)}

/* الميثاق */
.charter{background:linear-gradient(160deg,#fffdf5,#fff);border:3px double var(--gold);border-radius:26px;padding:26px;position:relative}
.charter h3{text-align:center;color:#8a5a00;font-size:1.6rem;font-weight:900}
.pledge{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;margin:8px 0;background:#fff;border:2px solid #f1e3bd;cursor:pointer;transition:all .2s;font-weight:700}
.pledge input{width:22px;height:22px;accent-color:#b45309}
.pledge.on{background:#fff8e6;border-color:var(--gold)}
.saved{font-size:.85rem;font-weight:700;color:var(--muted);min-height:1.3em}
.saved.ok{color:var(--ok)}.saved.bad{color:var(--bad)}

/* التقييم */
.axis{margin-bottom:22px}
.axis-h{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,#0f2a6b,#1d4ed8);color:#fff;border-radius:18px;padding:12px 18px}
.axis-h b{font-size:1.1rem}
.axis-prog{font-size:.85rem;background:rgba(255,255,255,.15);border-radius:99px;padding:2px 12px}
.rate{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid #eef2f8}
.rate .it{flex:1 1 260px;font-weight:600}
.rstars{display:flex;gap:4px;direction:ltr}
.rstars button{background:none;font-size:1.7rem;line-height:1;color:#d7deea;transition:transform .1s,color .1s;padding:2px}
.rstars button.on{color:var(--gold)}
.rstars button:hover{transform:scale(1.2)}
.rlabel{min-width:84px;text-align:center;font-size:.8rem;font-weight:800;color:var(--turq2)}
.scale-legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.scale-legend span{background:#fff;border:1px solid #e3eaf7;border-radius:10px;padding:3px 10px;font-size:.82rem;font-weight:700;color:var(--royal)}
.thanks{background:linear-gradient(140deg,#0b1f55,#0f766e);color:#fff;border-radius:26px;padding:30px;text-align:center;font-size:1.2rem;font-weight:700}

/* شهادة */
.cert-wrap{background:#fff;border-radius:22px;padding:14px;box-shadow:var(--sh)}
.cert-wrap canvas{width:100%;height:auto;border-radius:12px;display:block}

/* إشعار */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:#0f172a;color:#fff;padding:12px 22px;border-radius:16px;font-weight:700;z-index:99;transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 40px -20px #000;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.ok{background:#065f46}.toast.bad{background:#991b1b}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:80;display:grid;place-items:center;padding:16px;animation:enter .2s}
.modal{background:#fff;border-radius:24px;max-width:860px;width:100%;max-height:90vh;overflow:auto;padding:24px}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid #dbe3f2;border-top-color:var(--royal2);animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* الإدارة */
.kpi{background:#fff;border-radius:20px;padding:18px;box-shadow:var(--sh);border-top:6px solid var(--c,var(--royal2))}
.kpi .v{direction:ltr;unicode-bidi:isolate;text-align:right;font-size:2rem;font-weight:900;color:var(--c,var(--royal2));line-height:1.2}
.kpi .l{font-weight:700;color:var(--muted);font-size:.9rem}
.bars .br{display:grid;grid-template-columns:minmax(120px,240px) 1fr 70px;gap:10px;align-items:center;margin:8px 0}
.bars .br span{font-weight:600;font-size:.92rem}
.bars .br .t{height:16px;background:#e7edf7;border-radius:99px;overflow:hidden}
.bars .br .t i{display:block;height:100%;border-radius:99px;background:var(--c,var(--royal2));transition:width 1s}
.bars .br b{color:var(--royal);text-align:left;direction:ltr}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{background:#1e3a8a;color:#fff;padding:10px;text-align:right;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid #eef2f8}
.tbl tr:hover td{background:#f6f9ff}
.tblwrap{overflow:auto;border-radius:16px;border:1px solid #e3eaf7}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:800}
.pill.y{background:#d1fae5;color:#065f46}.pill.n{background:#fef3c7;color:#92400e}
.fbk{background:#f8fafc;border-radius:12px;padding:8px 12px;margin:6px 0;border-right:4px solid var(--c,var(--turq))}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{padding:9px 16px;border-radius:12px;background:#fff;border:2px solid #dbe3f2;font-weight:800;color:var(--royal)}
.tabs button.on{background:var(--royal);color:#fff;border-color:var(--royal)}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:30px 0}
@media(max-width:560px){.card{padding:18px}.hero-card{padding:34px 16px 30px;border-radius:26px}.bars .br{grid-template-columns:110px 1fr 54px}.who{display:none}}
@media print{.topbar,.no-print,footer,.sky{display:none!important}body{background:#fff}.card{box-shadow:none}}
.toast{opacity:0;pointer-events:none}.toast.on{opacity:1}
@media(max-width:560px){.brand{font-size:.85rem;gap:6px}.brand small{display:none}.brand .logo{height:32px;font-size:.8rem;padding:0 8px}}

/* ===== الحركة الافتتاحية ===== */
#intro{position:fixed;inset:0;z-index:200;overflow:hidden;background:radial-gradient(900px 600px at 50% 40%,#173a9b 0,#0b1f55 55%,#06102e 100%);color:#fff;display:grid;place-items:center;transition:opacity .9s,transform .9s,filter .9s}
#intro.out{opacity:0;transform:scale(1.15);filter:blur(8px);pointer-events:none}
.in-sky i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.in-start{position:relative;z-index:3;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;transition:opacity .5s,transform .5s}
.in-logo{min-width:96px;height:96px;padding:0 30px;border-radius:30px;display:grid;place-items:center;font-size:2.6rem;font-weight:900;background:linear-gradient(135deg,#f3d58a,#d4a64a 55%,#b7862c);color:#3b2a06;box-shadow:0 0 0 10px rgba(243,213,138,.12),0 20px 50px -10px #d4a64a;animation:bob 3s ease-in-out infinite}
.in-hello{font-size:1.5rem;font-weight:800;color:#e0e7ff}
#in-go{padding:16px 34px;border-radius:22px;font-size:1.25rem;font-weight:900;color:#0b1f55;background:linear-gradient(135deg,#fff,#f3d58a);box-shadow:0 0 0 0 rgba(243,213,138,.7);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(243,213,138,.6)}70%{box-shadow:0 0 0 22px rgba(243,213,138,0)}100%{box-shadow:0 0 0 0 rgba(243,213,138,0)}}
.in-start small{color:#99f6e4;font-weight:700}
#intro.play .in-start{opacity:0;transform:scale(.8);pointer-events:none}
.in-skip{position:absolute;bottom:26px;left:22px;z-index:4;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);padding:8px 16px;border-radius:12px;font-weight:700}
.in-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0}
#intro.play .in-stage{opacity:1}
.in-burst{position:absolute;left:50%;top:42%;width:20px;height:20px;margin:-10px;border-radius:50%;background:radial-gradient(circle,rgba(243,213,138,.9),rgba(20,184,166,.35) 40%,transparent 70%);opacity:0}
#intro.play .in-burst{animation:burst 2.2s .35s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:scale(1)}30%{opacity:1}100%{opacity:0;transform:scale(60)}}
.in-book{position:relative;width:200px;height:140px;perspective:900px;transform:scale(0) rotate(-20deg);margin-bottom:26px}
#intro.play .in-book{animation:bookin 1s .3s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes bookin{to{transform:scale(1) rotate(0)}}
.in-page,.in-cover{position:absolute;top:0;width:100px;height:140px;border-radius:6px}
.in-page{background:linear-gradient(#fff,#eef4ff);box-shadow:inset 0 0 0 2px #dbe5f7}
.in-page.l{left:0;border-radius:10px 2px 2px 10px}.in-page.r{right:0;border-radius:2px 10px 10px 2px}
.in-page:before{content:"";position:absolute;inset:22px 16px;background:repeating-linear-gradient(#cbd5e1 0 3px,transparent 3px 16px)}
.in-cover{background:linear-gradient(135deg,#1d4ed8,#0f2a6b);box-shadow:inset 0 0 0 3px #d4a64a;backface-visibility:hidden}
.in-cover.l{left:0;transform-origin:right center}.in-cover.r{right:0;transform-origin:left center}
#intro.play .in-cover.l{animation:openl .9s 1s ease-in-out forwards}
#intro.play .in-cover.r{animation:openr .9s 1s ease-in-out forwards}
@keyframes openl{to{transform:rotateY(-160deg)}}@keyframes openr{to{transform:rotateY(160deg)}}
.in-glow{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#f3d58a;box-shadow:0 0 60px 30px rgba(243,213,138,.7);opacity:0}
#intro.play .in-glow{animation:glow 2s 1.2s ease-out forwards}
@keyframes glow{0%{opacity:0}30%{opacity:1}100%{opacity:.35}}
.in-bits{position:absolute;left:50%;top:calc(50% - 110px);width:0;height:0}
.in-bits span{position:absolute;font-size:30px;font-weight:900;opacity:0;text-shadow:0 0 14px currentColor}
#intro.play .in-bits span{animation:fly 1.6s var(--d) cubic-bezier(.15,.9,.3,1) forwards}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.2) rotate(0)}25%{opacity:1}100%{opacity:.85;transform:translate(var(--x),var(--y)) scale(1) rotate(25deg)}}
.in-title{font-size:clamp(1.9rem,8.5vw,3.8rem);font-weight:900;line-height:1.35;margin-top:8px;padding:0 14px;text-align:center;text-shadow:0 6px 30px rgba(0,0,0,.4)}
.in-title span{display:inline-block;opacity:0;color:#fff;white-space:nowrap}
#intro.play .in-title span{animation:letter .6s ease-out forwards}
@keyframes letter{0%{opacity:0;transform:translateY(30px) scale(.5);color:#f3d58a}60%{opacity:1;transform:translateY(-6px) scale(1.15);color:#f3d58a}100%{opacity:1;transform:none;color:#fff}}
.in-sub,.in-motto,.in-school{opacity:0;transform:translateY(14px)}
.in-sub{font-size:1.4rem;font-weight:800;color:#5eead4}
.in-motto{margin-top:10px;font-weight:800;color:#f3d58a;font-size:1.1rem;padding:6px 18px;border:1px solid rgba(243,213,138,.5);border-radius:14px}
.in-school{margin-top:14px;color:#c7d2fe;font-weight:600;font-size:.95rem}
#intro.play .in-sub{animation:rise .7s 2.5s forwards}#intro.play .in-motto{animation:rise .7s 3s forwards}#intro.play .in-school{animation:rise .7s 3.4s forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-delay:0s!important}}
.cheer{background:linear-gradient(135deg,#fffaf0,#effcfa);border:2px solid #f3e3b5;border-radius:22px;padding:16px 18px;margin:18px 0;display:grid;gap:10px;position:relative;overflow:hidden}
.cheer:before{content:"✦";position:absolute;left:14px;top:6px;font-size:2.6rem;color:rgba(212,166,74,.18)}
.cheer-row{display:flex;gap:12px;align-items:flex-start}
.cheer-ic{font-size:1.5rem;line-height:1.4}
.cheer small{display:block;color:var(--turq2);font-weight:800;font-size:.78rem}
.cheer b{color:var(--royal);font-size:1.05rem;line-height:1.7;display:block}
.cheer .btn{justify-self:start}
.cheer b.pop{animation:enter .45s}
.in-cheer{opacity:0;transform:translateY(14px);margin-top:14px;max-width:560px;padding:0 18px;color:#fff;font-weight:700;font-size:1.05rem;line-height:1.8}
#intro.play .in-cheer{animation:rise .7s 3.5s forwards}
#intro.play .in-school{animation-delay:3.9s}
@media(max-width:400px){.brand>div:last-child{display:none}}
</style>
</head>

/* ===== طبقة قاعدة البيانات: Supabase أو قاعدة بيانات Claude ===== */
const Store = (() => {
  const CFG = window.NAFES_CONFIG || {};
  let mode = null, db = null, user = null, uid = null;
  const sb = () => CFG.SUPABASE_URL.replace(/\/$/, '');
  // المفاتيح الجديدة (sb_publishable_) تُرسل في apikey فقط؛ ولا يُرسل Bearer إلا لرمز مستخدم أو مفتاح JWT قديم
  function hdr(token, extra = {}) { const h = Object.assign({ apikey: CFG.SUPABASE_ANON_KEY }, extra); const t = token || (/^eyJ/.test(CFG.SUPABASE_ANON_KEY) ? CFG.SUPABASE_ANON_KEY : null); if (t) h.Authorization = 'Bearer ' + t; return h; }

  async function rpc(fn, body, token) {
    const r = await fetch(`${sb()}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: hdr(token, { 'Content-Type': 'application/json' }),
      body: JSON.stringify(body)
    });
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch { }
    if (!r.ok) throw new Error((j && (j.message || j.error)) || ('HTTP ' + r.status));
    return j;
  }
  function withTimeout(p, ms, msg) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg || 'انتهت مهلة الاتصال بقاعدة البيانات')), ms))]); }
  function genCode() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const r = crypto.getRandomValues(new Uint8Array(8)); let s = ''; r.forEach((v, i) => { s += a[v % a.length]; if (i === 3) s += '-'; }); return 'NF-' + s; }

  async function init() {
    if (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY) { mode = 'supabase'; return mode; }
    if (window.claude && window.claude.use) {
      try {
        db = await withTimeout(window.claude.use('db'), 12000);
        user = await withTimeout(window.claude.use('user'), 12000).catch(() => null);
        try { window.__downloads = await window.claude.use('downloads'); } catch { }
        if (db && user) { uid = await user.id(); if (uid) { mode = 'claude'; return mode; } }
      } catch (e) { console.warn(e); }
    }
    mode = 'none'; return mode;
  }

  /* -------- المشاركات -------- */
  async function register(info) {
    if (mode === 'supabase') {
      const code = await rpc('nafes_register', { p: info });
      return load(code);
    }
    if (mode === 'claude') {
      const now = new Date().toISOString();
      const rec = { code: genCode(), uid, mother_name: info.mother_name, student_name: info.student_name, grade_section: info.grade_section, contact: info.contact || '', consent: true, completed: false, data: {}, created_at: now, updated_at: now };
      const ref = db.doc('participants/' + uid);
      await ref.set(rec);
      const back = await ref.get(); // تأكيد الحفظ بالقراءة من القاعدة
      if (!back.exists) throw new Error('تعذر تأكيد الحفظ');
      return back.data();
    }
    throw new Error('قاعدة البيانات غير متصلة');
  }
  async function load(code) {
    if (mode === 'supabase') { const r = await rpc('nafes_load', { p_code: code }); if (!r) throw new Error('رقم المشاركة غير موجود'); return r; }
    if (mode === 'claude') { const s = await db.doc('participants/' + uid).get(); return s.exists ? s.data() : null; }
    return null;
  }
  async function myRecord() { // للاستئناف التلقائي
    if (mode === 'claude') return load();
    return null;
  }
  async function save(code, section, payload) {
    const stamped = Object.assign({}, payload, { saved_at: new Date().toISOString() });
    if (mode === 'supabase') { const t = await rpc('nafes_save', { p_code: code, p_section: section, p_data: stamped }); return t; }
    if (mode === 'claude') {
      const ref = db.doc('participants/' + uid);
      const upd = { data: { [section]: stamped }, updated_at: stamped.saved_at };
      if (section === 'evaluation' && payload.submitted) upd.completed = true;
      await ref.update(upd);
      const back = await ref.get(); // تأكيد بعد استجابة القاعدة
      const got = back.exists && back.data().data && back.data().data[section];
      if (!got || got.saved_at !== stamped.saved_at) throw new Error('تعذر تأكيد الحفظ');
      return stamped.saved_at;
    }
    throw new Error('قاعدة البيانات غير متصلة');
  }

  /* -------- الإدارة -------- */
  let adminToken = null;
  async function adminLogin(email, password) {
    if (mode === 'supabase') {
      const r = await fetch(`${sb()}/auth/v1/token?grant_type=password`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_ANON_KEY }, body: JSON.stringify({ email, password }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error_description || j.msg || 'بيانات الدخول غير صحيحة');
      adminToken = j.access_token;
      const ok = await rpc('nafes_is_admin', {}, adminToken);
      if (!ok) { adminToken = null; throw new Error('هذا الحساب ليس له صلاحية الإدارة'); }
      return true;
    }
    if (mode === 'claude') { const ok = user && (user.canEdit ? await user.canEdit() : false); if (!ok) throw new Error('لوحة الإدارة متاحة لمالكة المنصة ومحرراتها فقط'); return true; }
    throw new Error('قاعدة البيانات غير متصلة');
  }
  async function adminAuto() { if (mode === 'claude' && user) { try { return !!(await user.canEdit()); } catch { return false; } } return false; }
  async function adminList() {
    if (mode === 'supabase') {
      const r = await fetch(`${sb()}/rest/v1/participants?select=*&order=created_at.desc`, { headers: hdr(adminToken) });
      if (!r.ok) throw new Error('تعذر جلب البيانات (' + r.status + ')'); return r.json();
    }
    if (mode === 'claude') { const s = await db.collection('participants').limit(1000).get(); return s.docs.map(d => d.data()).sort((a, b) => String(b.created_at).localeCompare(String(a.created_at))); }
    return [];
  }
  return { init, register, load, myRecord, save, adminLogin, adminAuto, adminList, get mode() { return mode; } };
})();

function saveSection(section, payload, opt = {}) {
  const job = saveChain.then(async () => {
    const ind = opt.indicator; if (ind) { ind.className = 'saved'; ind.textContent = 'جارٍ الحفظ…'; }
    try {
      const at = await Store.save(REC.code, section, payload);
      REC.data = REC.data || {}; REC.data[section] = Object.assign({}, payload, { saved_at: at });
      if (section === 'evaluation' && payload.submitted) REC.completed = true;
      if (ind) { ind.className = 'saved ok'; ind.textContent = '✓ حُفظ في قاعدة البيانات ' + new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' }); }
      if (!opt.silent) toast('✓ تم الحفظ في قاعدة البيانات', 'ok');
      updateProgress();

    } catch (e) {
      console.error(e);

      toast('✗ تعذّر الحفظ: ' + e.message, 'bad');

  saveChain = job.catch(() => { });
  return job;
}
const PENDING = new Set();
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); PENDING.delete(t); t = setTimeout(() => { PENDING.delete(t); fn(...a); }, ms); PENDING.add(t); }; }

  $('#who').textContent = REC ? `${REC.mother_name} • ${REC.code}` : 'زائرة';

function unlocked(key) {
  if (!REC) return false;
  if (key === 'pre') return true;
  const order = ['st1', 'st2', 'st3', 'st4', 'st5', 'plan', 'charter'];
  const i = order.indexOf(key);
  if (i === 0) return isDone('pre');
  if (i > 0) return isDone(order[i - 1]);
  if (key === 'post') return order.every(isDone);
  if (key === 'evaluation') return isDone('post');

  return false;
}

    ${idx < questions.length - 1 ? `<button class="btn sm" id="nextq" ${answers[idx] === null ? 'disabled' : ''}>التالي ←</button>` : `<button class="btn gold sm" id="finq" ${answers.some(a => a === null) ? 'disabled' : ''}>إنهاء وتسليم</button>`}</div>
    <p class="muted" style="margin-top:10px;font-size:.85rem">ستظهر الإجابات الصحيحة بعد تسليم الاختبار.</p></div></section>`;
    if (answers[idx] !== null) $$('.opt')[answers[idx]].classList.add('sel');
    $$('.opt').forEach(b => b.onclick = () => { answers[idx] = +b.dataset.i; draw(); });
    $('#prevq') && ($('#prevq').onclick = () => { idx--; draw(); });
    $('#nextq') && ($('#nextq').onclick = () => { idx++; draw(); });
    $('#finq') && ($('#finq').onclick = async () => {
      const b = $('#finq'); b.disabled = true; b.textContent = 'جارٍ الحفظ…';

}

/* ===== لوحة التحكم الإدارية ===== */
const Admin = (() => {
  let ROWS = [], tab = 'overview';
  const avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null;
  const dt = v => v ? new Date(v).toLocaleString('en-GB', { hour12: false }).replace(',', '') : '';
  const r1 = v => v == null ? '—' : (Math.round(v * 10) / 10).toString();
  const pc = v => v == null ? '—' : Math.round(v) + '%';
  const dd = r => r.data || {};
  const fixEv = r => { const e = r.data && r.data.evaluation; if (e) { e.ratings = e.ratings || {}; e.open = e.open || {}; } return r; };
  const done = (r, k) => k === 'evaluation' ? !!(dd(r).evaluation && dd(r).evaluation.submitted) : !!(dd(r)[k] && dd(r)[k].done);
  const STK = ['st1', 'st2', 'st3', 'st4', 'st5', 'plan', 'charter'];

  function stats() {
    const R = ROWS; const n = R.length;
    const completed = R.filter(r => done(r, 'evaluation') && done(r, 'post')).length;
    const evals = R.filter(r => done(r, 'evaluation')).map(r => Object.assign({ ratings: {}, open: {} }, dd(r).evaluation));
    const pre = R.filter(r => done(r, 'pre')).map(r => dd(r).pre), post = R.filter(r => done(r, 'post')).map(r => dd(r).post);
    const paired = R.filter(r => done(r, 'pre') && done(r, 'post'));
    const preAvg = avg(pre.map(p => p.pct)), postAvg = avg(post.map(p => p.pct));
    const pairPre = avg(paired.map(r => dd(r).pre.pct)), pairPost = avg(paired.map(r => dd(r).post.pct));
    const improve = pairPre != null && pairPost != null ? pairPost - pairPre : null;
    const dom = (src, d) => { const xs = R.filter(r => done(r, src)).map(r => dd(r)[src].byDomain && dd(r)[src].byDomain[d]).filter(Boolean); const c = xs.reduce((s, v) => s + v[0], 0), t = xs.reduce((s, v) => s + v[1], 0); return t ? c / t * 100 : null; };
    const domains = Object.keys(DOMAINS).map(d => ({ d, name: DOMAINS[d], pre: dom('pre', d), post: dom('post', d) }));
    // نتائج المجالات من جميع الأنشطة (الاختبار البعدي + المسابقة + المحطات)
    const stPct = k => { const xs = R.filter(r => done(r, k) && dd(r)[k].total).map(r => dd(r)[k].score / dd(r)[k].total * 100); return avg(xs); };
    const subj = {
      lughati: avg([dom('post', 'lughati'), (() => { const xs = R.filter(r => done(r, 'st5')).map(r => dd(r).st5.byDomain.lughati).filter(Boolean); const t = xs.reduce((s, v) => s + v[1], 0); return t ? xs.reduce((s, v) => s + v[0], 0) / t * 100 : null; })(), stPct('st2')].filter(v => v != null)),
      reading: avg([dom('post', 'reading'), (() => { const xs = R.filter(r => done(r, 'st5')).map(r => dd(r).st5.byDomain.reading).filter(Boolean); const t = xs.reduce((s, v) => s + v[1], 0); return t ? xs.reduce((s, v) => s + v[0], 0) / t * 100 : null; })(), stPct('st3')].filter(v => v != null)),
      math: avg([dom('post', 'math'), (() => { const xs = R.filter(r => done(r, 'st5')).map(r => dd(r).st5.byDomain.math).filter(Boolean); const t = xs.reduce((s, v) => s + v[1], 0); return t ? xs.reduce((s, v) => s + v[0], 0) / t * 100 : null; })(), stPct('st4')].filter(v => v != null))
    };
    const axis = {}; EVAL_AXES.forEach(a => { axis[a.k] = avg(evals.flatMap(e => (e.ratings[a.k] || []).filter(Boolean))); });
    const items = []; EVAL_AXES.forEach(a => a.items.forEach((it, i) => items.push({ ax: a.t, it, v: avg(evals.map(e => (e.ratings[a.k] || [])[i]).filter(Boolean)) })));
    const overall = avg(evals.map(e => e.overall).filter(Boolean));
    const recCounts = {}; RECOMMEND.forEach(k => recCounts[k] = evals.filter(e => e.recommend === k).length);
    const recPct = evals.length ? (recCounts['نعم بالتأكيد'] + recCounts['نعم']) / evals.length * 100 : null;
    const best = {}; evals.forEach(e => { const b = e.open && e.open.best_station; if (b) best[b] = (best[b] || 0) + 1; });
    const texts = k => evals.map(e => e.open && e.open[k]).filter(Boolean);
    const stationDone = STK.map((k, i) => ({ k, t: STATIONS[i].title, n: R.filter(r => done(r, k)).length, pct: stPct(k) }));
    const avgStations = avg(R.map(r => STK.filter(k => done(r, k)).length));
    const quizPts = avg(R.filter(r => done(r, 'st5')).map(r => dd(r).st5.points));
    return { n, completed, compRate: n ? completed / n * 100 : null, evalsN: evals.length, preAvg, postAvg, pairPre, pairPost, improve, pairedN: paired.length, domains, subj, axis, items, overall, recCounts, recPct, best, texts, stationDone, avgStations, quizPts, plans: R.filter(r => done(r, 'plan')).length, charters: R.filter(r => done(r, 'charter')).length };
  }
  function keywords(arr) {
    const stop = new Set('في من على إلى عن مع هذا هذه ذلك التي الذي أن إن كان كانت لا ما هو هي و أو ثم كل جدا جدًا الورشة شيء أكثر بعض نعم لم لن قد كما عند بين حتى هل وفي ومن'.split(' '));
    const c = {}; arr.join(' ').replace(/[^؀-ۿ\s]/g, ' ').split(/\s+/).map(w => w.replace(/^(وال|بال|كال|فال|ال|و)/, '')).filter(w => w.length > 2 && !stop.has(w)).forEach(w => c[w] = (c[w] || 0) + 1);
    return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 8);

    out.push('متابعة تطبيق الخطط الأسبوعية مع الأمهات عبر قنوات التواصل المدرسية وتعزيز الشراكة مع الأسرة.');
    return out;
  }

      const block = (title, k, color) => { const t = S.texts(k); const kw = keywords(t); return `<div class="card"><b style="color:var(--royal)">${title} <span class="muted">(${t.length})</span></b>${kw.length ? `<div class="chips" style="margin:8px 0">${kw.map(([w, n]) => `<span class="chip" style="font-size:.85rem;padding:4px 10px">${esc(w)} × ${n}</span>`).join('')}</div>` : ''}${t.map(x => `<div class="fbk" style="--c:${color}">${esc(x)}</div>`).join('') || '<p class="muted">لا توجد إجابات.</p>'}</div>`; };
      c.innerHTML = `<div class="card" style="margin-bottom:16px"><b style="color:var(--royal)">أكثر محطة استفادت منها الأمهات</b><div class="bars" style="margin-top:8px">${Object.entries(S.best).sort((a, b) => b[1] - a[1]).map(([k, v]) => barRow(k, v, S.evalsN, '#14b8a6', v)).join('') || '<p class="muted">—</p>'}</div></div>
      <div class="grid g2">${block('أبرز نقاط القوة', 'strengths', '#059669')}${block('فرص التحسين', 'improve', '#d97706')}${block('الاحتياجات التدريبية (مهارات للتعمق)', 'deepen', '#1d4ed8')}${block('الموضوعات والمقترحات المستقبلية', 'suggest', '#7c3aed')}${block('أبرز المعلومات المكتسبة', 'key_info', '#0e9f9a')}</div>`;
    }
    if (tab === 'responses') {
      c.innerHTML = `<div class="field" style="max-width:420px"><input id="q" placeholder="🔎 البحث باسم الأم أو المتعلم أو رقم المشاركة"></div><div class="tblwrap"><table class="tbl"><thead><tr><th>الرقم</th><th>اسم الأم</th><th>المتعلم</th><th>الصف</th><th>التاريخ</th><th>القبلي</th><th>البعدي</th><th>المحطات</th><th>التقييم</th><th>الحالة</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
      const fill = q => { document.getElementById('tb').innerHTML = ROWS.filter(r => !q || [r.mother_name, r.student_name, r.code].join(' ').includes(q)).map(r => `<tr><td dir="ltr">${esc(r.code)}</td><td>${esc(r.mother_name)}</td><td>${esc(r.student_name)}</td><td>${esc(r.grade_section)}</td><td>${new Date(r.created_at).toLocaleDateString('ar-SA')}</td><td>${done(r, 'pre') ? dd(r).pre.score + '/10' : '—'}</td><td>${done(r, 'post') ? dd(r).post.score + '/10' : '—'}</td><td>${STK.filter(k => done(r, k)).length}/7</td><td>${done(r, 'evaluation') ? '★'.repeat(dd(r).evaluation.overall) : '—'}</td><td>${done(r, 'evaluation') ? '<span class="pill y">مكتملة</span>' : '<span class="pill n">قيد التقدم</span>'}</td><td><button class="btn sm ghost" data-v="${esc(r.code)}">عرض</button></td></tr>`).join(''); $$('[data-v]').forEach(b => b.onclick = () => detail(ROWS.find(r => r.code === b.dataset.v))); };
      fill(''); document.getElementById('q').oninput = e => fill(e.target.value.trim());

  }
  function ansLine(qs, ans) { return qs.map((q, i) => `<div class="fbk" style="--c:${ans && ans[i] === q.a ? '#059669' : '#dc2626'}">${i + 1}. ${esc(q.q)}<br><b>${ans && ans[i] != null && ans[i] >= 0 ? esc(q.o[ans[i]]) : 'لم تُجب'}</b> ${ans && ans[i] === q.a ? '✓' : '✗ (الصحيحة: ' + esc(q.o[q.a]) + ')'}</div>`).join(''); }
  function detail(r) {
    const d = dd(r); const ev = d.evaluation;
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="modal"><div class="row" style="justify-content:space-between"><h2 style="color:var(--royal)">${esc(r.mother_name)}</h2><div class="row"><button class="btn sm gold" id="ppdf">📄 PDF</button><button class="btn sm ghost" id="cls">إغلاق ✕</button></div></div>
    <p class="muted">${esc(r.code)} • المتعلم/ة: ${esc(r.student_name)} • ${esc(r.grade_section)} • تواصل: ${esc(r.contact || '—')} • التسجيل: ${new Date(r.created_at).toLocaleString('ar-SA')}</p>

    ${d.st5 ? `<h3 class="h3">تحدي الأم الذكية: ${d.st5.points} نقطة • ${'★'.repeat(d.st5.stars)}</h3>${ansLine(ST5_QUIZ, d.st5.answers)}` : ''}

    ${ev ? `<h3 class="h3">تقييم الورشة ${ev.submitted ? '' : '(مسودة)'} — عام: ${'★'.repeat(ev.overall || 0)} • التوصية: ${esc(ev.recommend || '—')}</h3>${EVAL_AXES.map(ax => `<div class="fbk"><b>${ax.t}:</b> متوسط ${r1(avg((ev.ratings[ax.k] || []).filter(Boolean)))} — [${(ev.ratings[ax.k] || []).join('، ')}]</div>`).join('')}${EVAL_OPEN.map(o => ev.open && ev.open[o.k] ? `<div class="fbk" style="--c:#7c3aed"><b>${o.t}</b><br>${esc(ev.open[o.k])}</div>` : '').join('')}` : ''}
    </div>`;
    document.body.appendChild(ov);
    ov.onclick = e => { if (e.target === ov) ov.remove(); }; ov.querySelector('#cls').onclick = () => ov.remove();
    ov.querySelector('#ppdf').onclick = () => participantPDF(r);
  }

  /* -------- Excel -------- */
  function rowsForExcel() {
    const head = ['رقم المشاركة', 'اسم الأم', 'اسم المتعلم', 'الصف', 'وسيلة التواصل', 'تاريخ المشاركة', 'آخر تحديث', 'الحالة', 'القبلي', 'القبلي %', 'البعدي', 'البعدي %', 'التحسن', 'المحطة1', 'المحطة2', 'المحطة3', 'المحطة4', 'نقاط التحدي', 'نجوم التحدي', 'أيام الخطة المنجزة', 'بنود الميثاق', 'المحاور: المحتوى', 'التصميم', 'التفاعل', 'الأثر', 'التقييم العام', 'التوصية', 'المحطات المكتملة'];
    const main = [head, ...ROWS.map(r => { const d = dd(r), ev = d.evaluation; const s = k => d[k] && d[k].total ? d[k].score + '/' + d[k].total : ''; return [r.code, r.mother_name, r.student_name, r.grade_section, r.contact || '', dt(r.created_at), dt(r.updated_at), done(r, 'evaluation') ? 'مكتملة' : 'قيد التقدم', d.pre ? d.pre.score : '', d.pre ? d.pre.pct : '', d.post ? d.post.score : '', d.post ? d.post.pct : '', d.pre && d.post ? d.post.score - d.pre.score : '', s('st1'), s('st2'), s('st3'), s('st4'), d.st5 ? d.st5.points : '', d.st5 ? d.st5.stars : '', d.plan ? d.plan.completed_days : '', d.charter ? (d.charter.pledges || []).filter(Boolean).length : '', ...EVAL_AXES.map(ax => ev && ev.ratings[ax.k] ? Math.round(avg(ev.ratings[ax.k].filter(Boolean)) * 100) / 100 : ''), ev ? ev.overall || '' : '', ev ? ev.recommend || '' : '', STK.filter(k => done(r, k)).length]; })];
    const tests = [['رقم المشاركة', 'اسم الأم', 'الاختبار', 'رقم السؤال', 'المجال', 'السؤال', 'إجابتها', 'الإجابة الصحيحة', 'صحيحة؟']];
    ROWS.forEach(r => [['pre', PRE_TEST, 'القبلي'], ['post', POST_TEST, 'البعدي'], ['st5', ST5_QUIZ, 'تحدي الأم الذكية'], ['st1', ST1_CHECK, 'المحطة 1'], ['st3', ST3_GAME, 'المحقق الصغير'], ['st4', ST4_CH, 'مختبر الرياضيات']].forEach(([k, qs, nm]) => { const d = dd(r)[k]; if (!d || !d.answers) return; qs.forEach((q, i) => { const a = d.answers[i]; tests.push([r.code, r.mother_name, nm, i + 1, DOMAINS[q.d] || q.k || '', q.q, a != null && a >= 0 ? (q.o ? q.o[a] : 'الجملة ' + (a + 1)) : 'لم تُجب', q.o ? q.o[q.a] : 'الجملة ' + (q.a + 1), a === q.a ? 'نعم' : 'لا']); }); }));
    const evalH = ['رقم المشاركة', 'اسم الأم', 'مُرسل؟']; EVAL_AXES.forEach(ax => ax.items.forEach((it, i) => evalH.push(`${ax.t} ${i + 1}: ${it}`))); evalH.push('التقييم العام', 'التوصية');
    const evals = [evalH, ...ROWS.filter(r => dd(r).evaluation).map(r => { const e = dd(r).evaluation; return [r.code, r.mother_name, e.submitted ? 'نعم' : 'مسودة', ...EVAL_AXES.flatMap(ax => (e.ratings[ax.k] || []).map(v => v || '')), e.overall || '', e.recommend || '']; })];
    const fb = [['رقم المشاركة', 'اسم الأم', ...EVAL_OPEN.map(o => o.t)], ...ROWS.filter(r => dd(r).evaluation).map(r => [r.code, r.mother_name, ...EVAL_OPEN.map(o => (dd(r).evaluation.open || {})[o.k] || '')])];
    const plans = [['رقم المشاركة', 'اسم الأم', 'وقت المذاكرة', ...PLAN_DAYS.map(p => p.d + ' (منجز)'), ...PLAN_DAYS.map(p => p.d + ' (ملاحظات)'), 'بنود الميثاق', 'التوقيع', 'رسالة الأم للمتعلم']];
    ROWS.forEach(r => { const d = dd(r); if (!d.plan && !d.charter) return; const days = (d.plan && d.plan.days) || {}; plans.push([r.code, r.mother_name, d.plan ? d.plan.time || '' : '', ...PLAN_DAYS.map(p => days[p.k] ? (days[p.k].done ? 'نعم' : 'لا') : ''), ...PLAN_DAYS.map(p => days[p.k] ? days[p.k].note || '' : ''), d.charter ? (d.charter.pledges || []).filter(Boolean).length : '', d.charter ? d.charter.signature || '' : '', d.charter ? d.charter.message || '' : '']); });
    const S = stats();
    const sum = [['المؤشر', 'القيمة'], ['عدد المشاركات', S.n], ['أكملن الورشة', S.completed], ['نسبة الإكمال %', S.compRate == null ? '' : Math.round(S.compRate)], ['التقييمات المستلمة', S.evalsN], ['متوسط القبلي %', S.preAvg == null ? '' : Math.round(S.preAvg)], ['متوسط البعدي %', S.postAvg == null ? '' : Math.round(S.postAvg)], ['التحسن (نقطة مئوية)', S.improve == null ? '' : Math.round(S.improve * 10) / 10], ['لغتي %', S.subj.lughati == null ? '' : Math.round(S.subj.lughati)], ['فهم المقروء %', S.subj.reading == null ? '' : Math.round(S.subj.reading)], ['الرياضيات %', S.subj.math == null ? '' : Math.round(S.subj.math)], ['متوسط الرضا /5', S.overall == null ? '' : Math.round(S.overall * 100) / 100], ...EVAL_AXES.map(ax => [ax.t + ' /5', S.axis[ax.k] == null ? '' : Math.round(S.axis[ax.k] * 100) / 100]), ['نسبة التوصية %', S.recPct == null ? '' : Math.round(S.recPct)]];
    return [{ name: 'الملخص', rows: sum }, { name: 'المشاركات', rows: main }, { name: 'إجابات الاختبارات والأنشطة', rows: tests }, { name: 'تقييم الورشة', rows: evals }, { name: 'الملاحظات والمقترحات', rows: fb }, { name: 'الخطط والميثاق', rows: plans }];
  }
  async function exportExcel() {
    const bytes = Lib.xlsx(rowsForExcel());
    const r = await Lib.download(`نتائج-ورشة-نافس-${new Date().toISOString().slice(0, 10)}.xlsx`, bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    if (r === 'saved') toast('✓ تم تجهيز ملف Excel', 'ok');
  }

  /* -------- التقرير الختامي PDF -------- */
  async function reportPDF(S) {
    try { await document.fonts.load('700 30px Tajawal'); } catch { }
    const doc = new Lib.DocCanvas({ header: `${SCHOOL.name} • التقرير الختامي • ${WS.title}` });
    const dt = fmtDates(new Date().toISOString());
    doc.title('التقرير الختامي لورشة «' + WS.title + '»', WS.subtitle + ' — ' + dt.g);
    doc.p(`أُعدّ هذا التقرير آليًا من البيانات الفعلية المحفوظة في قاعدة بيانات المنصة حتى تاريخ إصداره.`, { color: '#475569', size: 21 });
    doc.h('أولًا: أهداف الورشة'); doc.bullets(WS.goals);
    doc.h('ثانيًا: المشاركة والتفاعل');
    doc.kpis([{ label: 'عدد المشاركات', value: S.n }, { label: 'أكملن الورشة', value: S.completed, color: '#059669' }, { label: 'نسبة الإكمال', value: pc(S.compRate), color: '#0e9f9a' }, { label: 'التقييمات المستلمة', value: S.evalsN, color: '#b7862c' }]);
    doc.p(`مستوى التفاعل: متوسط المحطات المنجزة لكل مشاركة ${r1(S.avgStations)} من 7، وأعدّت ${S.plans} مشاركة خطة أسبوعية، واعتمدت ${S.charters} مشاركة ميثاق الأسرة الداعمة.`);
    doc.bars(S.stationDone.map(s => ({ label: s.t, value: s.n, max: S.n || 1, color: '#14b8a6', text: `${s.n}/${S.n}` })));
    doc.h('ثالثًا: نتائج الاختبارات القبلية والبعدية');
    doc.kpis([{ label: 'متوسط القبلي', value: pc(S.preAvg), color: '#64748b' }, { label: 'متوسط البعدي', value: pc(S.postAvg) }, { label: 'التحسن (نقطة مئوية)', value: S.improve == null ? '—' : (S.improve >= 0 ? '+' : '') + r1(S.improve), color: '#059669' }]);
    doc.bars(S.domains.flatMap(d => [{ label: d.name + ' — قبلي', value: d.pre || 0, max: 100, color: '#94a3b8', text: pc(d.pre) }, { label: d.name + ' — بعدي', value: d.post || 0, max: 100, color: '#1d4ed8', text: pc(d.post) }]));
    doc.h('رابعًا: نتائج الأنشطة');
    doc.bars([{ label: 'لغتي', value: S.subj.lughati || 0, max: 100, color: '#0891b2', text: pc(S.subj.lughati) }, { label: 'فهم المقروء', value: S.subj.reading || 0, max: 100, color: '#0d9488', text: pc(S.subj.reading) }, { label: 'الرياضيات', value: S.subj.math || 0, max: 100, color: '#7c3aed', text: pc(S.subj.math) }, ...S.stationDone.filter(s => s.pct != null).map(s => ({ label: 'أداء: ' + s.t, value: s.pct, max: 100, color: '#c2410c', text: pc(s.pct) }))]);
    doc.p(`متوسط نقاط «تحدي الأم الذكية»: ${r1(S.quizPts)} من 100.`);
    doc.h('خامسًا: نتائج تقييم الورشة');
    doc.kpis([{ label: 'متوسط الرضا العام /5', value: r1(S.overall), color: '#b7862c' }, { label: 'نسبة التوصية', value: pc(S.recPct), color: '#059669' }, { label: 'عدد المقيّمات', value: S.evalsN }]);
    doc.bars(EVAL_AXES.map(ax => ({ label: ax.t, value: S.axis[ax.k] || 0, max: 5, color: '#1d4ed8', text: r1(S.axis[ax.k]) + ' / 5' })));
    const top = S.items.filter(i => i.v != null).sort((a, b) => b.v - a.v);
    if (top.length) { doc.p('أعلى البنود تقييمًا:', { bold: true }); doc.bars(top.slice(0, 5).map(i => ({ label: i.it, value: i.v, max: 5, color: '#059669', text: r1(i.v) }))); doc.p('أدنى البنود تقييمًا:', { bold: true }); doc.bars(top.slice(-5).reverse().map(i => ({ label: i.it, value: i.v, max: 5, color: '#d97706', text: r1(i.v) }))); }
    doc.p('التوصية بالورشة: ' + RECOMMEND.map(k => `${k} (${S.recCounts[k]})`).join('، '));
    doc.h('سادسًا: أبرز نقاط القوة'); const st = S.texts('strengths'); st.length ? doc.bullets(st.slice(0, 12)) : doc.p('لا توجد إجابات بعد.');
    doc.h('سابعًا: أبرز فرص التحسين'); const im = S.texts('improve'); im.length ? doc.bullets(im.slice(0, 12)) : doc.p('لا توجد إجابات بعد.');
    const need = S.texts('deepen'); if (need.length) { doc.h('ثامنًا: الاحتياجات التدريبية والمقترحات'); doc.bullets(need.slice(0, 8)); const sg = S.texts('suggest'); if (sg.length) doc.bullets(sg.slice(0, 8), { dot: '#7c3aed' }); }
    doc.h('التوصيات المستقبلية'); doc.bullets(recommendations(S), { dot: '#1d4ed8' });
    doc.space(30); doc.p(`${SCHOOL.counselorTitle}: ${SCHOOL.counselor}          ${SCHOOL.principalTitle}: ${SCHOOL.principal}`, { bold: true, color: '#0f2a6b' });
    const pdf = Lib.pdfFromCanvases(doc.pages, false);
    const r = await Lib.download(`التقرير-الختامي-ورشة-نافس.pdf`, pdf, 'application/pdf'); if (r === 'saved') toast('✓ تم تجهيز التقرير PDF', 'ok');
    return doc.pages;
  }
  async function participantPDF(r) {
    const d = dd(r); const doc = new Lib.DocCanvas({ header: `${SCHOOL.name} • ${WS.title} • نتائج مشاركة` });
    doc.title(r.mother_name, `رقم المشاركة ${r.code} • المتعلم/ة: ${r.student_name} • ${r.grade_section}`);
    doc.kpis([{ label: 'القبلي', value: d.pre ? d.pre.score + '/10' : '—', color: '#64748b' }, { label: 'البعدي', value: d.post ? d.post.score + '/10' : '—' }, { label: 'نقاط التحدي', value: d.st5 ? d.st5.points : '—', color: '#c2410c' }, { label: 'المحطات', value: STK.filter(k => done(r, k)).length + '/7', color: '#059669' }]);
    const tbl = (title, qs, ans) => { if (!ans) return; doc.h(title); doc.table(['#', 'السؤال', 'إجابتها', 'النتيجة'], qs.map((q, i) => [i + 1, q.q, ans[i] != null && ans[i] >= 0 ? q.o[ans[i]] : '—', ans[i] === q.a ? '✓' : '✗'] ), [60, 620, 300, 100]); };
    tbl('الاختبار القبلي', PRE_TEST, d.pre && d.pre.answers); tbl('الاختبار البعدي', POST_TEST, d.post && d.post.answers); tbl('تحدي الأم الذكية', ST5_QUIZ, d.st5 && d.st5.answers);
    if (d.evaluation) { doc.h('تقييم الورشة'); doc.bars(EVAL_AXES.map(ax => ({ label: ax.t, value: avg((d.evaluation.ratings[ax.k] || []).filter(Boolean)) || 0, max: 5, text: r1(avg((d.evaluation.ratings[ax.k] || []).filter(Boolean))) }))); EVAL_OPEN.forEach(o => { const v = (d.evaluation.open || {})[o.k]; if (v) doc.p(o.t + ' ' + v); }); }
    if (d.charter && d.charter.message) { doc.h('رسالة الأم للمتعلم'); doc.p(d.charter.message); }
    const pdf = Lib.pdfFromCanvases(doc.pages, false); await Lib.download(`نتائج-${r.mother_name}.pdf`, pdf, 'application/pdf');
  }
  return { open, stats: () => stats(), _set: rows => ROWS = rows, exportRows: rowsForExcel, reportPDF };
})();
